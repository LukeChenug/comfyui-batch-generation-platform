                if (this.layoutMode === 'grid') {
                    taskList.classList.add('grid-layout');
                } else {
                    taskList.classList.remove('grid-layout');
                }
                
                // 调试：打印所有任务状态
                const allTasks = Object.values(this.tasks);
                const generatingTasksBefore = allTasks.filter(t => t.status === 'generating');
                console.log('🔍 过滤前 - 当前所有任务数量:', allTasks.length);
                console.log('🔍 过滤前 - generating 状态任务:', generatingTasksBefore.map(t => ({ id: t.task_id, status: t.status, created_at: t.created_at })));
                console.log('🔍 当前 viewMode:', this.viewMode);
                
                // 根据viewMode过滤任务，失败任务和无图片任务直接过滤掉，不显示
                let filteredTasks = Object.values(this.tasks).filter(task => {
                    // 失败任务直接过滤掉，不显示在列表中
                    if (task.status === 'failed' || task.status === 'error') {
                        return false;
                    }
                    
                    // 已完成但没有图片的任务也过滤掉
                    if (task.status === 'completed') {
                        const hasImages = (task.result_urls && task.result_urls.length > 0) || task.result_url;
                        if (!hasImages) {
                            return false; // 已完成但没有图片，不显示
                        }
                    }
                    
                    if (this.viewMode === 'completed') {
                        return task.status === 'completed';
                    } else if (this.viewMode === 'failed') {
                        // 失败视图模式也不显示（因为失败任务已经被过滤）
                        return false;
                    }
                    return true; // 'all' 或其他值：显示所有状态，包括 generating, running, completed（有图片的）
                });
                
                console.log('🔍 过滤后（排序前）任务数量:', filteredTasks.length);
                console.log('🔍 过滤后（排序前）generating 状态任务:', filteredTasks.filter(t => t.status === 'generating').map(t => ({ id: t.task_id, status: t.status })));
                
                // 排序
                filteredTasks = filteredTasks.sort((a, b) => {
                    // 确保有 created_at 才排序，没有的放在最后
                    const dateA = a.created_at ? new Date(a.created_at) : new Date(0);
                    const dateB = b.created_at ? new Date(b.created_at) : new Date(0);
                    return dateB - dateA; // 降序：最新的在上面
                });
                
                console.log('🔍 排序后任务数量:', filteredTasks.length);
                console.log('🔍 排序后 generating 状态任务:', filteredTasks.filter(t => t.status === 'generating').map(t => ({ id: t.task_id, status: t.status, created_at: t.created_at })));
                console.log('过滤后的任务数量:', filteredTasks.length);
                console.log('generating 状态的任务:', filteredTasks.filter(t => t.status === 'generating').length);
                console.log('running 状态的任务:', filteredTasks.filter(t => t.status === 'running').length);

                if (filteredTasks.length === 0) {
                    const emptyMessage = this.viewMode === 'failed' 
                        ? '暂无失败任务' 
                        : '暂无任务';
                    taskList.innerHTML = `<div style="text-align: center; padding: 50px; color: #757575;">${emptyMessage}</div>`;
                    return;
                }

                // 🎯 优化：保存当前已加载图片的状态，避免刷新时闪烁
                const existingImages = new Map();
                taskList.querySelectorAll('.task-item[data-task-id]').forEach(taskItem => {
                    const taskIdAttr = taskItem.getAttribute('data-task-id');
                    if (taskIdAttr) {
                        const images = taskItem.querySelectorAll('img[data-loaded="true"]');
                        if (images.length > 0) {
                            existingImages.set(taskIdAttr, {
                                loaded: true,
                                opacity: images[0].style.opacity || '1'
                            });
                        }
                    }
                });

                taskList.innerHTML = filteredTasks.map(task => {
                    // 计算用时
                    let duration = '';
                    if (task.created_at && task.completed_at) {
                        const start = new Date(task.created_at);
                        const end = new Date(task.completed_at);
                        const seconds = Math.round((end - start) / 1000);
                        duration = seconds;
                    }

                    // 格式化日期为 2025/11/7 格式
                    const formatDate = (dateString) => {
                        const date = new Date(dateString);
                        const year = date.getFullYear();
                        const month = date.getMonth() + 1;
                        const day = date.getDate();
                        return `${year}/${month}/${day}`;
                    };

                    // 宫格布局模式：只显示图片，不显示标题和提示词
                    if (this.layoutMode === 'grid') {
                        return `
                        <div class="task-item" data-task-id="${task.task_id}">
                            ${this.renderResultImages(task, duration, existingImages.get(task.task_id))}
                        </div>
                        `;
                    }
                    
                    // 列表布局模式：显示完整信息
                    return `
                    <div class="task-item" data-task-id="${task.task_id}">
                        <div class="task-header">
                            <div class="task-header-left"></div>
                            <div class="task-header-right"></div>
                        </div>
                        
                        <div class="task-details">
                            ${this.renderWorkflowTitle(task)}
                            ${this.renderResultImages(task, duration, existingImages.get(task.task_id))}
                        </div>
                    </div>
                    `;
                }).join('');
                
                // 🎯 优化：处理已加载的图片，立即显示，避免闪烁
                requestAnimationFrame(() => {
                    const images = taskList.querySelectorAll('.image-grid-item img');
                    images.forEach(img => {
                        // 如果图片已经加载完成，立即显示，不等待onload
                        if (img.complete) {
                            img.style.opacity = '1';
                            img.style.transition = 'none'; // 禁用过渡效果，立即显示
                            img.setAttribute('data-loaded', 'true');
                            // 下一帧恢复过渡效果（用于hover等交互）
                            requestAnimationFrame(() => {
                                img.style.transition = '';
                            });
                        }
                    });
                    
                    // 宫格布局：调整瀑布流高度
                    if (this.layoutMode === 'grid') {
                        const gridImages = taskList.querySelectorAll('.task-item-grid img');
                        gridImages.forEach(img => {
                            if (img.complete) {
                                this.adjustGridItemHeight(img);
                            }
                        });
                        
                        // 🆕 处理 Loading 状态的高度
                        const loadingItems = taskList.querySelectorAll('.task-item-grid.generating');
                        loadingItems.forEach(item => {
                            this.adjustLoadingGridItemHeight(item);
                        });
                    }
                });
                
                // 同步参数信息区域高度与图片区域高度
                this.syncParamsHeight();
            }

            // 🚀 降级修复：回归全量更新逻辑，确保DOM一定被创建
            updateTaskList() {
                const taskList = document.getElementById('taskList');
                
                // 根据布局模式设置CSS类
                if (this.layoutMode === 'grid') {
                    taskList.classList.add('grid-layout');
                } else {
                    taskList.classList.remove('grid-layout');
                }
                
                // 1. 数据过滤与排序
                const TIMEOUT_MS = 30 * 60 * 1000; // 30分钟超时
                const now = Date.now();

                let filteredTasks = Object.values(this.tasks).filter(task => {
                    if (task.status === 'failed' || task.status === 'error') return false;
                    
                    // 僵尸任务过滤
                    if ((task.status === 'generating' || task.status === 'running' || task.status === 'pending') && 
                        task.created_at && 
                        (now - new Date(task.created_at).getTime() > TIMEOUT_MS)) {
                        return false;
                    }

                    if (task.status === 'completed') {
                        const hasImages = (task.result_urls && task.result_urls.length > 0) || task.result_url;
                        if (!hasImages) return false;
                    }
                    if (this.viewMode === 'completed') return task.status === 'completed';
                    else if (this.viewMode === 'failed') return false;
                    return true;
                });
                
                filteredTasks = filteredTasks.sort((a, b) => {
                    const dateA = a.created_at ? new Date(a.created_at) : new Date(0);
                    const dateB = b.created_at ? new Date(b.created_at) : new Date(0);
                    return dateB - dateA;
                });

                // 2. 空状态处理
                if (filteredTasks.length === 0) {
                    const emptyMessage = this.viewMode === 'failed' ? '暂无失败任务' : '暂无任务';
                    taskList.innerHTML = `<div style="text-align: center; padding: 50px; color: #757575;">${emptyMessage}</div>`;
                    return;
                }
                
                // 3. 保存现有图片的加载状态，防止闪烁
                const existingImages = new Map();
                taskList.querySelectorAll('img[data-loaded="true"]').forEach(img => {
                    // 尝试找到该图片所属的 task id
                    const taskItem = img.closest('.task-item');
                    if (taskItem) {
                        const taskId = taskItem.getAttribute('data-task-id');
                        if (taskId) existingImages.set(taskId, { loaded: true });
                    }
                });

                // 4. 🚀 全量重建 DOM (简单粗暴，但绝对有效)
                // 虽然会闪烁一下，但能保证显示。之前的Diff逻辑在某些情况下失效了。
                taskList.innerHTML = filteredTasks.map(task => {
                    // 计算用时
                    let duration = '';
                    if (task.created_at && task.completed_at) {
                        const start = new Date(task.created_at);
                        const end = new Date(task.completed_at);
                        duration = Math.round((end - start) / 1000);
                    }
                    
                    // 宫格布局
                    if (this.layoutMode === 'grid') {
                        return `
                        <div class="task-item" data-task-id="${task.task_id}" data-status="${task.status}" data-progress="${Math.round(task.progress||0)}">
                            ${this.renderResultImages(task, duration, existingImages.get(task.task_id))}
                        </div>`;
                    } 
                    // 列表布局
                    else {
                        return `
                        <div class="task-item" data-task-id="${task.task_id}" data-status="${task.status}" data-progress="${Math.round(task.progress||0)}">
                            <div class="task-header">
                                <div class="task-header-left"></div>
                                <div class="task-header-right"></div>
                            </div>
                            <div class="task-details">
                                ${this.renderWorkflowTitle(task)}
                                ${this.renderResultImages(task, duration, existingImages.get(task.task_id))}
                            </div>
                        </div>`;
                    }
                }).join('');
                
                // 5. 恢复图片状态和调整布局
                requestAnimationFrame(() => {
                    // 立即显示已加载的图片
                    const images = taskList.querySelectorAll('img');
                    images.forEach(img => {
                        // 如果图片在缓存里，或者之前已经加载过
                        if (img.complete) {
                            img.style.opacity = '1';
                            img.setAttribute('data-loaded', 'true');
                        }
                    });
                    
                    // 宫格布局高度调整
                    if (this.layoutMode === 'grid') {
                        const adjustAll = () => {
                            const gridImages = taskList.querySelectorAll('.task-item-grid img');
                            gridImages.forEach(img => {
                                this.adjustGridItemHeight(img);
                            });
                            const loadingItems = taskList.querySelectorAll('.task-item-grid.generating');
                            loadingItems.forEach(item => this.adjustLoadingGridItemHeight(item));
                        };
                        
                        adjustAll();
                        // 多次尝试，确保图片加载后能调整
                        setTimeout(adjustAll, 100);
                        setTimeout(adjustAll, 500);
                    }
                });
                
                this.syncParamsHeight();
            }

            // 调整瀑布流布局中图片的高度
            adjustGridItemHeight(img) {
                if (this.layoutMode !== 'grid') return;
                
                const gridItem = img.closest('.task-item-grid');
                if (!gridItem) return;
                
                const taskItem = gridItem.closest('.task-item');
                if (!taskItem) return;
                
                // 等待图片完全加载后再计算
                if (!img.complete || img.naturalHeight === 0) {
                    img.onload = () => this.adjustGridItemHeight(img);
                    return;
                }
                
                // 基础行高和gap
                const baseRowHeight = 1; // grid-auto-rows的基础单位
                const rowGap = 4; // row-gap的值
                
                // 使用图片的自然高度和容器宽度计算实际显示高度
                const containerWidth = taskItem.offsetWidth || taskItem.getBoundingClientRect().width;
                if (containerWidth === 0) {
                    // 如果容器宽度为0，延迟计算
                    setTimeout(() => this.adjustGridItemHeight(img), 50);
                    return;
                }
                
                const aspectRatio = img.naturalWidth / img.naturalHeight;
                const imageHeight = containerWidth / aspectRatio;
                
                // 计算需要的行数
                // 当有row-gap时，需要解方程：imageHeight = rowSpan * baseRowHeight + (rowSpan - 1) * rowGap
                // 即：imageHeight = rowSpan * (baseRowHeight + rowGap) - rowGap
                // 所以：rowSpan = (imageHeight + rowGap) / (baseRowHeight + rowGap)
                let rowSpan = Math.round((imageHeight + rowGap) / (baseRowHeight + rowGap));
                
                // 验证计算：实际占据的高度
                let actualHeight = rowSpan * baseRowHeight + (rowSpan - 1) * rowGap;
                
                // 如果实际高度明显大于图片高度（超过2px），尝试减少一行
                if (actualHeight > imageHeight + 2) {
                    rowSpan = Math.max(1, rowSpan - 1);
                    actualHeight = rowSpan * baseRowHeight + (rowSpan - 1) * rowGap;
                }
                
                // 如果实际高度明显小于图片高度（小于-2px），尝试增加一行
                if (actualHeight < imageHeight - 2) {
                    rowSpan = rowSpan + 1;
                    actualHeight = rowSpan * baseRowHeight + (rowSpan - 1) * rowGap;
                }
                
                // 设置grid-row-end，确保精确匹配
                taskItem.style.gridRowEnd = `span ${rowSpan}`;
                taskItem.style.gridRowStart = 'auto';
                gridItem.style.height = `${imageHeight}px`;
                gridItem.style.width = '100%';
                
                // 确保图片完全填充容器
                img.style.width = '100%';
                img.style.height = '100%';
            }

            // 调整Loading状态格子的高度
            adjustLoadingGridItemHeight(item) {
                if (this.layoutMode !== 'grid') return;
                
                const taskItem = item.closest('.task-item');
                if (!taskItem) return;
                
                const baseRowHeight = 1;
                const rowGap = 4;
                
                const containerWidth = taskItem.offsetWidth || taskItem.getBoundingClientRect().width;
                if (containerWidth === 0) {
                    setTimeout(() => this.adjustLoadingGridItemHeight(item), 50);
                    return;
                }
                
                const width = parseInt(item.getAttribute('data-width') || 1024);
                const height = parseInt(item.getAttribute('data-height') || 1024);
                
                const aspectRatio = width / height;
                const itemHeight = containerWidth / aspectRatio;
                
                let rowSpan = Math.round((itemHeight + rowGap) / (baseRowHeight + rowGap));
                taskItem.style.gridRowEnd = `span ${rowSpan}`;
                item.style.height = `${itemHeight}px`; // 显式设置高度
            }

            renderResultImages(task, duration = '', existingImageState = null) {
                const taskId = task.task_id || '';
                const taskStatus = task.status || 'unknown';
                
                // 🎯 如果图片已经加载过，使用已加载状态，避免闪烁
                const imageInitialOpacity = existingImageState && existingImageState.loaded ? '1' : '0';
                const imageInitialTransition = existingImageState && existingImageState.loaded ? 'none' : 'opacity 0.2s ease';
                
                // Render result images based on task status
                
                // 生成中状态（包括 generating、running 和 pending）
                if (task.status === 'generating' || task.status === 'running' || task.status === 'pending') {
                    console.log(`🔄 任务 ${taskId} 显示loading, 状态: ${task.status}`);
                    const progress = Math.round(task.progress || 0);
                    const statusText = task.status === 'pending' ? '排队中' : '生成中';
                    
                    // 宫格布局模式 - 显示带有Loading状态的占位符
                    if (this.layoutMode === 'grid') {
                        let width = 1024;
                        let height = 1024;
                        if (task.request_data) {
                            width = parseInt(task.request_data.width || 1024);
                            height = parseInt(task.request_data.height || 1024);
                        }
                        // 计算高度百分比 (padding-bottom) = height / width * 100
                        const aspectRatio = (height / width * 100).toFixed(2); 

                        return `
                            <div class="task-item-grid generating" data-task-id="${taskId}" 
                                 data-width="${width}" data-height="${height}"
                                 style="position: relative; background: var(--loading-bg, #444444) !important; display: block; width: 100%; box-shadow: inset 0 0 30px rgba(0,0,0,0.1);">
                                 
                                 <!-- 占位 div，通过 padding-bottom 撑开高度 -->
                                 <div style="width: 100%; padding-bottom: ${aspectRatio}%;"></div>
                                 
                                 <!-- 绝对定位的内容层 -->
                                 <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                                    <div class="spinner" style="width: 30px; height: 30px; border-width: 2px;"></div>
                                    <div style="margin-top: 10px; color: var(--accent-color, #80A5A0); font-size: 0.8rem;">${statusText} ${progress}%</div>
                                    <div style="width: 60%; height: 3px; background: var(--loading-border, #444); margin-top: 5px; border-radius: 2px; overflow: hidden;">
                                        <div style="width: ${progress}%; height: 100%; background: var(--accent-color, #80A5A0); border-radius: 2px; transition: width 0.3s ease-out;"></div>
                                    </div>
                                 </div>
                            </div>
                        `;
                    }

                    return `
                        <div>
                            ${this.renderPromptOnly(task)}
                            <div class="result-container">
                                <div class="image-grid" style="display: flex; align-items: center; justify-content: center; min-height: 400px; max-height: 480px;">
                                    <div class="loading-spinner">
                                        <div class="spinner"></div>
                                        <div style="margin-top: 20px; color: var(--accent-color, #80A5A0); font-size: 0.9rem;">${statusText} ${progress}%</div>
                                        <div style="width: 200px; height: 4px; background: var(--loading-border, #333); margin-top: 10px; border-radius: 2px; overflow: hidden;">
                                            <div style="width: ${progress}%; height: 100%; background: var(--accent-color, #80A5A0); border-radius: 2px; transition: width 0.3s ease-out;"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
                
                // 支持多张图片显示
                if (task.result_urls && task.result_urls.length > 0) {
                    // 宫格布局模式 - 瀑布流
                    if (this.layoutMode === 'grid') {
                        const firstImageUrl = this.getImageUrl(task.result_urls[0]);
                        return `
                            <div class="task-item-grid" onclick="manager.previewTaskDetail('${taskId}', 0)" data-task-id="${taskId}">
                                <img src="${firstImageUrl}" 
                                     alt="生成结果" 
                                     loading="lazy"
                                     style="width: 100%; height: auto; display: block; object-fit: cover;"
                                     onload="manager.adjustGridItemHeight(this); this.setAttribute('data-loaded', 'true');"
                                     onerror="console.error('图片加载失败:', '${firstImageUrl}'); this.style.display='none';">
                            </div>
                        `;
                    }
                    
                    const imageCount = task.result_urls.length;
                    // 检测是否是四张图片（不管是1:1还是16:9）
                    const is4Images = imageCount === 4;
                    // 检测是否是1:1比例的四张图片
                    const isSquare4Images = is4Images && 
                                           task.request_data && 
                                           task.request_data.width === task.request_data.height;
                    
                    // 检测是否是2张或3张图片（需要特殊处理，确保完整显示）
                    const is2Or3Images = imageCount === 2 || imageCount === 3;
                    const is3Images = imageCount === 3;
                    
                    // 计算图片的宽高比（用于16:9等非1:1比例）
                    let imageAspectRatio = null;
                    if (task.request_data && task.request_data.width && task.request_data.height) {
                        imageAspectRatio = task.request_data.width / task.request_data.height;
                    }
                    
                    // 根据情况添加不同的class
                    let gridClass = 'image-grid';
                    if (is4Images) {
                        if (isSquare4Images) {
                            // 1:1的4张图片：使用横向排列
                            gridClass = 'image-grid image-grid-4x1';
                        } else {
                            // 16:9的4张图片：使用默认image-grid，通过容器的image-container-wide-4x2类来控制样式（2行2列）
                            gridClass = 'image-grid';
                        }
                    } else if (is3Images) {
                        gridClass = 'image-grid image-grid-3x1';
                    }
                    // 16:9单张图片使用默认的image-grid类，通过容器的image-container-wide-1x1类来控制样式
                    
                    // 多张图片模式 - 宫格布局
                    let imageItemStyle = "";
                    if (is4Images) {
                        if (isSquare4Images) {
                            // 4张1:1图片：每张占 (100% - 30px) / 4，强制1:1比例
                            imageItemStyle = "width: calc((100% - 30px) / 4) !important; flex: 1 1 calc((100% - 30px) / 4) !important; max-width: calc((100% - 30px) / 4) !important; box-sizing: border-box; padding: 0 !important; margin: 0 !important; position: relative; aspect-ratio: 1 !important; background: transparent !important; border: none !important; overflow: visible !important;";
                        } else {
                            // 4张非1:1图片（如16:9）：2行2列，每张占 (100% - 10px) / 2，高度自适应
                            imageItemStyle = "width: calc((100% - 10px) / 2) !important; flex: 0 0 calc((100% - 10px) / 2) !important; max-width: calc((100% - 10px) / 2) !important; min-width: calc((100% - 10px) / 2) !important; box-sizing: border-box; padding: 0 !important; margin: 0 !important; position: relative; height: auto !important; min-height: 0 !important; max-height: none !important; background: transparent !important; border: none !important; overflow: visible !important;";
                        }
                    } else if (is3Images) {
                        // 3张图片：每张占 (100% - 20px) / 3，横向排列，高度自适应
                        imageItemStyle = "width: calc((100% - 20px) / 3) !important; flex: 1 1 calc((100% - 20px) / 3) !important; max-width: calc((100% - 20px) / 3) !important; box-sizing: border-box; padding: 0 !important; margin: 0 !important; position: relative; height: auto !important; min-height: 0 !important; max-height: none !important; background: transparent !important; border: none !important; overflow: visible !important;";
                    } else if (imageCount === 2) {
                        // 2张图片：检测是否是16:9等非1:1比例
                        const isWideImage = imageAspectRatio && imageAspectRatio > 1.1; // 宽高比大于1.1认为是宽图（如16:9）
                        if (isWideImage) {
                            // 16:9等宽图2张：每张占 (100% - 10px) / 2，高度自适应
                            imageItemStyle = "width: calc((100% - 10px) / 2) !important; flex: 1 1 calc((100% - 10px) / 2) !important; max-width: calc((100% - 10px) / 2) !important; box-sizing: border-box; padding: 0 !important; margin: 0 !important; position: relative; height: auto !important; min-height: 0 !important; max-height: none !important; background: transparent !important; border: none !important; overflow: visible !important;";
                        } else {
                            // 2张图片（非16:9）：每张占 (100% - 10px) / 2
                            imageItemStyle = "width: calc((100% - 10px) / 2) !important; flex: 1 1 calc((100% - 10px) / 2) !important; max-width: calc((100% - 10px) / 2) !important; box-sizing: border-box; padding: 0 !important; margin: 0 !important; position: relative; min-height: 400px; max-height: 100%; height: 100%; background: transparent !important; border: none !important; overflow: visible !important;";
                        }
                    } else if (imageCount === 1) {
                        // 单张图片：检测是否是16:9等非1:1比例
                        const isWideImage = imageAspectRatio && imageAspectRatio > 1.1; // 宽高比大于1.1认为是宽图（如16:9）
                        if (isWideImage) {
                            // 16:9等宽图：宽度100%，高度自适应
                            imageItemStyle = "width: 100% !important; max-width: 100% !important; box-sizing: border-box; padding: 0 !important; margin: 0 !important; position: relative; height: auto !important; min-height: 0 !important; max-height: none !important; background: transparent !important; border: none !important; overflow: visible !important;";
                        } else {
                            // 1:1或其他比例：默认样式
                            imageItemStyle = "min-height: 400px; max-height: 100%; max-width: 100%; box-sizing: border-box; height: 100%; width: 100%;";
                        }
                    } else {
                        // 其他情况（多张）：默认样式
                        imageItemStyle = "min-height: 400px; max-height: 100%; max-width: 100%; box-sizing: border-box; height: 100%; width: 100%;";
                    }
                    
                    let imageStyle = "";
                    if (is4Images) {
                        if (isSquare4Images) {
                            // 4张1:1图片：使用绝对定位填充容器
                            imageStyle = `width: 100% !important; height: 100% !important; max-width: 100% !important; max-height: 100% !important; object-fit: contain !important; object-position: center; display: block; opacity: ${imageInitialOpacity}; box-sizing: border-box; position: absolute; top: 0; left: 0; transition: ${imageInitialTransition};`;
                        } else {
                            // 4张非1:1图片（如16:9）：宽度100%，高度自适应

                        }
                    } else if (is3Images) {
                        // 3张图片：图片宽度100%，高度自适应

                    } else if (imageCount === 2) {

                        if (isWideImage) {

                            imageStyle = `width: 100% !important; height: auto !important; max-width: 100% !important; max-height: none !important; object-fit: contain !important; object-position: center; display: block; opacity: ${imageInitialOpacity}; box-sizing: border-box; transition: ${imageInitialTransition};`;

                    // 4张图片或3张图片时，容器不显示背景，只保留点击功能

                    let containerClass = 'result-container';
                    if (is4Images) {
                        if (isSquare4Images) {

                    } else if (imageCount === 2) {
                        // 2张图片：检测是否是16:9等非1:1比例
                        const isWideImage = imageAspectRatio && imageAspectRatio > 1.1; // 宽高比大于1.1认为是宽图（如16:9）
                        if (isWideImage) {
                            containerClass = 'result-container image-container-wide-2x1';

                    } else if (imageCount === 1) {
                        // 单张图片：检测是否是16:9等非1:1比例
                        const isWideImage = imageAspectRatio && imageAspectRatio > 1.1; // 宽高比大于1.1认为是宽图（如16:9）
                        if (isWideImage) {
                            containerClass = 'result-container image-container-wide-1x1';
                        }
                    }
                    
                    let gridStyle = 'min-height: 400px; max-height: 480px; height: 400px; width: 100%;'; /* 🎯 缩小20%：从500px/600px改为400px/480px */
                    if (is4Images) {
                        // 4张图片（不管是1:1还是16:9）：高度自适应
                        gridStyle = 'height: auto !important; min-height: 0 !important; max-height: none !important; width: 100%; margin: 0 !important; padding: 0 !important; background: transparent !important;';
                    } else if (is3Images) {
                        gridStyle = 'height: auto !important; min-height: 0 !important; max-height: none !important; width: 100%; margin: 0 !important; padding: 0 !important; background: transparent !important;';
                    } else if (imageCount === 2) {
                        // 2张图片：检测是否是16:9等非1:1比例
                        const isWideImage = imageAspectRatio && imageAspectRatio > 1.1; // 宽高比大于1.1认为是宽图（如16:9）
                        if (isWideImage) {

                            gridStyle = 'height: auto !important; min-height: 0 !important; max-height: none !important; width: 100%; margin: 0 !important; padding: 0 !important; background: transparent !important;';

                        const isWideImage = imageAspectRatio && imageAspectRatio > 1.1; // 宽高比大于1.1认为是宽图（如16:9）
                        if (isWideImage) {
                            // 16:9等宽图：高度自适应

            // 获取工作流标题和图标（白色线框类型）
            getWorkflowInfo(workflowType) {
                const workflowMap = {
                    'qwen_text2img': { title: '文生图', icon: '◯' }, // 白色圆圈线框
                    'qwen_img2img': { title: '图生图', icon: '□' }, // 白色方框线框
                    'rembg': { title: '角色抠图', icon: '◇' } // 白色菱形线框
                };
                return workflowMap[workflowType] || { title: '未知工作流', icon: '▢' };
            }

            // 渲染工作流标题
            renderWorkflowTitle(task) {
                const params = task.request_data || {};
                const workflowType = params.workflow_type || 'qwen_text2img';
                const workflowInfo = this.getWorkflowInfo(workflowType);
                return `
                    <div class="workflow-title">
                        <span class="workflow-text">${workflowInfo.title}</span>
                    </div>
                `;
            }

            // 只渲染提示词（用于图片列表）
            renderPromptOnly(task) {
                const params = task.request_data || {};
                return `
                    <div class="prompt-only">
                        ${params.prompt ? `
                            <div class="prompt-text">${this.escapeHtml(params.prompt)}</div>
                        ` : '<div class="prompt-text" style="color: #666;">无提示词</div>'}
                    </div>
                `;
            }

            renderGenerationParams(task, duration = '') {
                // 格式化创建时间为具体时间（包括时分秒）
                const formatDateTime = (dateString) => {
                    if (!dateString) return '';
                    const date = new Date(dateString);
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, '0');
                    const day = String(date.getDate()).padStart(2, '0');
                    const hours = String(date.getHours()).padStart(2, '0');
                    const minutes = String(date.getMinutes()).padStart(2, '0');
                    const seconds = String(date.getSeconds()).padStart(2, '0');
                    return `${year}/${month}/${day} ${hours}:${minutes}:${seconds}`;
                };

                const createdDateTime = formatDateTime(task.created_at);
                const taskId = task.task_id || '';
                const params = task.request_data || {};
                
                // 调试：检查参数数据
                console.log('🎨 渲染参数 - 任务:', taskId, '状态:', task.status, '参数:', params);
                
                return `
                    <div class="generation-params" onclick="event.stopPropagation(); manager.previewTaskDetail('${taskId}')" style="cursor: pointer;">
                        <div class="params-content">
                            ${params.prompt ? `
                                <div class="param-item">
                                    <div class="param-label">提示词：</div>
                                    <div class="param-value">${this.escapeHtml(params.prompt)}</div>
                                </div>
                            ` : ''}
                            ${params.negative_prompt ? `
                                <div class="param-item">
                                    <div class="param-label">负面提示词：</div>
                                    <div class="param-value">${this.escapeHtml(params.negative_prompt)}</div>
                                </div>
                            ` : ''}
                            ${duration ? `
                                <div class="param-item-inline" style="margin-bottom: 10px;">
                                    <span class="param-label">用时：</span>
                                    <span class="param-value">${duration}秒</span>
                                </div>
                            ` : ''}
                            ${params.width && params.height ? `
                                <div class="param-row">
                                    <div class="param-item-inline">
                                        <span class="param-label">尺寸：</span>
                                        <span class="param-value">${params.width}×${params.height}</span>
                                    </div>
                                    ${params.steps ? `
                                        <div class="param-item-inline">
                                            <span class="param-label">步数：</span>
                                            <span class="param-value">${params.steps}</span>
                                        </div>
                                    ` : ''}
                                    ${params.cfg ? `
                                        <div class="param-item-inline">
                                            <span class="param-label">CFG：</span>
                                            <span class="param-value">${params.cfg}</span>
                                        </div>
                                    ` : ''}
                                    ${params.seed ? `
                                        <div class="param-item-inline">
                                            <span class="param-label">种子：</span>
                                            <span class="param-value">${params.seed}</span>
                                        </div>
                                    ` : ''}
                                </div>
                            ` : ''}
                            ${taskId ? `
                                <div class="param-item-inline" style="margin-bottom: 10px;">
                                    <span class="param-label">任务ID：</span>
                                    <span class="param-value" style="font-family: monospace; color: #80A5A0;">${taskId}</span>
                                </div>
                            ` : ''}
                            ${createdDateTime ? `
                                <div class="param-item-inline" style="margin-bottom: 10px;">
                                    <span class="param-label">创建时间：</span>
                                    <span class="param-value">${createdDateTime}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            updateStats() {
                const tasks = Object.values(this.tasks);
                
                document.getElementById('totalTasks').textContent = tasks.length;
                document.getElementById('runningTasks').textContent = tasks.filter(t => t.status === 'running' || t.status === 'generating' || t.status === 'pending').length;
                
                // 如果弹窗打开，同步更新弹窗中的统计数据
                const statsModal = document.getElementById('statsModal');
                if (statsModal && statsModal.style.display === 'flex') {
                    updateStatsModal();
                }
                document.getElementById('completedTasks').textContent = tasks.filter(t => t.status === 'completed').length;
                
                const failedCount = tasks.filter(t => t.status === 'failed').length;
                const failedTasksElement = document.getElementById('failedTasks');
                failedTasksElement.textContent = failedCount;
                
                // 给失败数字添加点击事件
                if (failedCount > 0) {
                    failedTasksElement.style.cursor = 'pointer';
                    failedTasksElement.style.textDecoration = 'underline';
                    failedTasksElement.onclick = () => {
                        this.switchToFailedView();
                    };
                } else {
                    failedTasksElement.style.cursor = 'default';
                    failedTasksElement.style.textDecoration = 'none';
                    failedTasksElement.onclick = null;
                }
            }

            switchToFailedView() {
                this.viewMode = 'failed';
                this.updateTaskList();
                // 更新任务监控标题，显示当前视图
                this.updateTaskMonitorTitle();
            }

            switchToCompletedView() {
                this.viewMode = 'completed';
                this.updateTaskList();
                this.updateTaskMonitorTitle();
            }

            updateTaskMonitorTitle() {
                const taskMonitorTitle = document.querySelector('.monitoring-header');
                if (taskMonitorTitle) {
                    const collapseArrow = taskMonitorTitle.querySelector('.collapse-arrow');
                    const arrowHtml = collapseArrow ? collapseArrow.outerHTML : '';
                    
                    if (this.viewMode === 'failed') {
                        taskMonitorTitle.innerHTML = `任务监控 <span style="font-size: 14px; color: #f44336; margin-left: 10px; cursor: pointer; text-decoration: underline;" onclick="event.stopPropagation(); manager.switchToCompletedView()">返回成功列表</span> ${arrowHtml}`;
                        // 重新绑定点击事件
                        taskMonitorTitle.setAttribute('onclick', 'toggleTaskStats()');
                    } else {
                        taskMonitorTitle.innerHTML = `任务监控 ${arrowHtml}`;
                        // 重新绑定点击事件
                        taskMonitorTitle.setAttribute('onclick', 'toggleTaskStats()');
                    }
                }
            }

            getStatusText(status) {
                const statusMap = {
                    'pending': '等待中',
                    'running': '生成中',
                    'completed': '已完成',
                    'failed': '失败'
                };
                return statusMap[status] || status;
            }

            clearCompleted() {
                // 创建自定义确认对话框，而不使用系统confirm
                if (this.showConfirmDialog('确定要清除所有已完成和失败的任务吗？')) {
                    const activeTasks = {};
                    Object.values(this.tasks).forEach(task => {
                        if (task.status === 'pending' || task.status === 'running') {
                            activeTasks[task.task_id] = task;
                        }
                    });
                    
                    this.tasks = activeTasks;
                    this.updateTaskList();
                    this.updateStats();
                    this.showSuccessMessage('已清除完成和失败的任务');
                }
            }

            showConfirmDialog(message) {
                return confirm(message); // 保持简单的confirm，因为这是用户主动操作
            }

            // 下载图片功能
            downloadImage(imageUrl, filename) {
                const link = document.createElement('a');
                link.href = imageUrl;
                link.download = filename || 'generated-image.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // 预览图片（模态框）
            previewImage(imageUrl) {
                const modal = document.getElementById('imageModal');
                const modalImg = document.getElementById('modalImage');
                
                // 显示模态框
                modal.style.display = 'block';
                
                // 🎯 防止闪现：先隐藏图片并设置尺寸限制
                modalImg.style.opacity = '0';
                modalImg.style.display = 'block';
                modalImg.style.maxWidth = '95vw';
                modalImg.style.maxHeight = '95vh';
                modalImg.style.width = 'auto';
                modalImg.style.height = 'auto';
                modalImg.style.objectFit = 'contain';
                
                // 重置裁剪样式
                modalImg.style.clipPath = 'none';
                
                // 先设置图片源
                modalImg.src = imageUrl;
                
                // 等待图片加载完成后进行裁剪并显示
                const showImage = () => {
                    this.cropWhiteBackground(modalImg);
                    modalImg.style.opacity = '1';
                };
                
                if (modalImg.complete) {
                    showImage();
                } else {
                    modalImg.onload = showImage;
                }
            }
            
            // 自动裁剪白色背景
            cropWhiteBackground(img) {
                try {
                    // 如果图片来自不同源，可能无法读取像素数据
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.naturalWidth;
                    canvas.height = img.naturalHeight;
                    ctx.drawImage(img, 0, 0);
                    
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imageData.data;
                    
                    // 检测白色边缘的阈值（RGB值都大于240认为是白色）
                    const whiteThreshold = 240;
                    let minX = canvas.width;
                    let minY = canvas.height;
                    let maxX = 0;
                    let maxY = 0;
                    
                    // 扫描图片找到非白色区域的边界
                    for (let y = 0; y < canvas.height; y++) {
                        for (let x = 0; x < canvas.width; x++) {
                            const idx = (y * canvas.width + x) * 4;
                            const r = data[idx];
                            const g = data[idx + 1];
                            const b = data[idx + 2];
                            const a = data[idx + 3];
                            
                            // 检查是否为非白色像素（考虑透明度）
                            if (a > 0 && (r < whiteThreshold || g < whiteThreshold || b < whiteThreshold)) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                            }
                        }
                    }
                    
                    // 如果找到了有效区域，应用裁剪
                    if (minX < maxX && minY < maxY) {
                        const padding = 5; // 添加少量内边距
                        minX = Math.max(0, minX - padding);
                        minY = Math.max(0, minY - padding);
                        maxX = Math.min(canvas.width, maxX + padding);
                        maxY = Math.min(canvas.height, maxY + padding);
                        
                        // 计算裁剪比例
                        const cropLeft = minX / canvas.width;
                        const cropTop = minY / canvas.height;
                        const cropRight = maxX / canvas.width;
                        const cropBottom = maxY / canvas.height;
                        
                        // 使用 clip-path 裁剪图片
                        img.style.clipPath = `inset(${cropTop * 100}% ${(1 - cropRight) * 100}% ${(1 - cropBottom) * 100}% ${cropLeft * 100}%)`;
                        
                        // 调整图片尺寸以匹配裁剪后的区域
                        const cropWidth = maxX - minX;
                        const cropHeight = maxY - minY;
                        
                        // 检查是否在任务详情模态框中
                        const isTaskDetail = img.closest('.task-detail-left');
                        let maxDisplayWidth, maxDisplayHeight;
                        
                        if (isTaskDetail) {
                            // 任务详情模态框：图片最大60vw，高度80vh
                            maxDisplayWidth = window.innerWidth * 0.6;
                            maxDisplayHeight = window.innerHeight * 0.8;
                        } else {
                            // 图片预览模态框：95vw x 95vh
                            maxDisplayWidth = window.innerWidth * 0.95;
                            maxDisplayHeight = window.innerHeight * 0.95;
                        }
                        
                        if (cropWidth / cropHeight > maxDisplayWidth / maxDisplayHeight) {
                            img.style.width = maxDisplayWidth + 'px';
                            img.style.height = 'auto';
                        } else {
                            img.style.width = 'auto';
                            img.style.height = maxDisplayHeight + 'px';
                        }
                    }
                } catch (e) {
                    // 如果跨域或其他错误，保持原样显示
                    console.warn('裁剪白色背景失败，使用原图显示:', e);
                }
            }

            // 预览任务详情（包含图片和参数）
            previewTaskDetail(taskId, imageIndex = 0) {
                const task = this.tasks[taskId];
                if (!task) return;

                // 设置当前图片索引
                if (task.result_urls && task.result_urls.length > 0) {
                    // 确保索引在有效范围内
                    this.currentImageIndex = Math.max(0, Math.min(imageIndex || 0, task.result_urls.length - 1));
                } else {
                    this.currentImageIndex = 0;
                }

                // 渲染预览列表
                this.renderPreviewList(taskId);

                // 渲染当前任务的详情
                this.renderTaskDetail(taskId);

                // 显示模态框
                const modal = document.getElementById('taskDetailModal');
                modal.style.display = 'flex';

                // 添加键盘和鼠标滚轮事件监听
                this.setupTaskNavigation(taskId);
            }

            // 设置任务导航（键盘和鼠标滚轮）
            setupTaskNavigation(currentTaskId) {
                // 移除旧的事件监听器
                if (this.taskNavigationHandler) {
                    document.removeEventListener('keydown', this.taskNavigationHandler);
                }
                if (this.taskWheelHandler) {
                    const modal = document.getElementById('taskDetailModal');
                    modal.removeEventListener('wheel', this.taskWheelHandler);
                }

                // 切换任务函数
                const switchTask = (direction) => {
                    // 获取所有已完成的任务列表
                    const completedTasks = Object.values(this.tasks).filter(task => 
                        task.status === 'completed' && (task.result_url || (task.result_urls && task.result_urls.length > 0))
                    ).sort((a, b) => {
                        const timeA = new Date(a.created_at || 0).getTime();
                        const timeB = new Date(b.created_at || 0).getTime();
                        return timeB - timeA;
                    });

                    if (completedTasks.length === 0) return;

                    // 获取当前激活的任务ID
                    const activeItem = document.querySelector('.preview-item.active');
                    let currentTaskId = null;
                    if (activeItem) {
                        const onclick = activeItem.getAttribute('onclick');
                        const match = onclick && onclick.match(/'([^']+)'/);
                        if (match) {
                            currentTaskId = match[1];
                        }
                    }

                    // 如果找不到当前任务，使用第一个任务
                    if (!currentTaskId && completedTasks.length > 0) {
                        currentTaskId = completedTasks[0].task_id;
                    }

                    // 找到当前任务的索引
                    const currentIndex = completedTasks.findIndex(task => task.task_id === currentTaskId);
                    if (currentIndex === -1) return;

                    // 计算新索引（不循环）
                    let newIndex;
                    if (direction === 'next') {
                        newIndex = currentIndex + 1;
                        // 如果已经是最后一张，不切换
                        if (newIndex >= completedTasks.length) {
                            return;
                        }
                    } else {
                        newIndex = currentIndex - 1;
                        // 如果已经是第一张，不切换
                        if (newIndex < 0) {
                            return;
                        }
                    }

                    const newTask = completedTasks[newIndex];
                    if (newTask) {
                        // 切换任务时，重置图片索引为0
                        this.currentImageIndex = 0;
                        this.renderTaskDetail(newTask.task_id);
                        this.updatePreviewActive(newTask.task_id);
                    }
                };

                // 键盘事件处理
                this.taskNavigationHandler = (event) => {
                    const modal = document.getElementById('taskDetailModal');
                    if (modal.style.display !== 'flex') return;

                    // ESC键关闭模态框
                    if (event.key === 'Escape') {
                        closeTaskDetailModal();
                        return;
                    }

                    // 获取当前任务
                    const activeItem = document.querySelector('.preview-item.active');
                    let currentTaskId = null;
                    if (activeItem) {
                        const onclick = activeItem.getAttribute('onclick');
                        const match = onclick && onclick.match(/'([^']+)'/);
                        if (match) {
                            currentTaskId = match[1];
                        }
                    }
                    
                    if (!currentTaskId) return;
                    const currentTask = this.tasks[currentTaskId];
                    if (!currentTask) return;

                    // 左右箭头键：切换当前任务的多张图片（如果有多张）
                    if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && 
                        currentTask.result_urls && currentTask.result_urls.length > 1) {
                        event.preventDefault();
                        event.stopPropagation();
                        
                        let newIndex = this.currentImageIndex;
                        if (event.key === 'ArrowLeft') {
                            newIndex = Math.max(0, newIndex - 1);
                        } else {
                            newIndex = Math.min(currentTask.result_urls.length - 1, newIndex + 1);
                        }
                        
                        if (newIndex !== this.currentImageIndex) {
                            this.switchToImage(newIndex, currentTaskId);
                        }
                        return;
                    }

                    // 上下箭头键或左右键（单图任务）：切换任务
                    if (event.key === 'ArrowUp' || event.key === 'ArrowDown' || 
                        ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && 
                         (!currentTask.result_urls || currentTask.result_urls.length <= 1))) {
                        event.preventDefault();
                        if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
                            switchTask('prev');
                        } else {
                            switchTask('next');
                        }
                    }
                };

                // 鼠标滚轮事件处理
                this.taskWheelHandler = (event) => {
                    const modal = document.getElementById('taskDetailModal');
                    if (modal.style.display !== 'flex') return;

                    // 检查是否在预览区域
                    const previewArea = document.querySelector('.task-detail-preview');
                    if (previewArea && previewArea.contains(event.target)) {
                        return; // 在预览区域时不处理
                    }

                    event.preventDefault();
                    if (event.deltaY > 0) {
                        // 向下滚动，切换到下一个任务
                        switchTask('next');
                    } else {
                        // 向上滚动，切换到上一个任务
                        switchTask('prev');
                    }
                };

                // 添加事件监听器
                document.addEventListener('keydown', this.taskNavigationHandler);
                const modal = document.getElementById('taskDetailModal');
                modal.addEventListener('wheel', this.taskWheelHandler, { passive: false });
            }

            // 渲染任务详情
            renderTaskDetail(taskId) {
                const task = this.tasks[taskId];
                if (!task) return;

                // 确保当前图片索引在有效范围内
                if (task.result_urls && task.result_urls.length > 0) {
                    this.currentImageIndex = Math.max(0, Math.min(this.currentImageIndex || 0, task.result_urls.length - 1));
                } else {
                    this.currentImageIndex = 0;
                }

                // 计算用时
                let duration = '';
                if (task.created_at && task.completed_at) {
                    const start = new Date(task.created_at);
                    const end = new Date(task.completed_at);
                    const seconds = Math.round((end - start) / 1000);
                    duration = seconds;
                }

                // 渲染图片 - 多图时只显示一张
                const imagesContainer = document.getElementById('taskDetailImages');
                const bottomThumbnailsContainer = document.getElementById('taskDetailBottomThumbnails');
                
                if (task.result_urls && task.result_urls.length > 0) {
                    // 多图模式：只显示当前索引的图片
                    const currentUrl = this.getImageUrl(task.result_urls[this.currentImageIndex]);
                    const imageHtml = `
                        <div class="image-grid-item" style="position: relative; min-height: 500px; max-height: 100%;">
                            <img src="${currentUrl}" 
                                 alt="生成结果 ${this.currentImageIndex + 1}" 
                                 loading="lazy"
                                 onload="this.style.opacity='1'; this.setAttribute('data-loaded', 'true'); manager.cropWhiteBackground(this);"
                                 oncontextmenu="event.stopPropagation();"
                                 style="pointer-events: auto; position: relative; z-index: 0; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; opacity: 0; transition: opacity 0.2s ease;">
                                </div>
                    `;
                    imagesContainer.innerHTML = `<div class="image-grid">${imageHtml}</div>`;
                    
                    // 处理已加载的图片（从缓存中加载的）
                    setTimeout(() => {
                        const img = imagesContainer.querySelector('img');
                        if (img && img.complete && !img.hasAttribute('data-loaded')) {
                            img.style.opacity = '1';
                            img.setAttribute('data-loaded', 'true');
                        }
                    }, 50);
                    
                    // 显示并渲染底部缩略图列表
                    bottomThumbnailsContainer.style.display = 'flex';
                    this.renderBottomThumbnails(task.result_urls, taskId);
                } else if (task.result_url) {
                    // 单图模式
                    const fullUrl = this.getImageUrl(task.result_url);
                    const imageHtml = `
                        <div class="image-grid-item" style="position: relative; min-height: 500px; max-height: 100%;">
                            <img src="${fullUrl}" 
                                 alt="生成结果" 
                                 loading="lazy"
                                 onerror="console.error('图片加载失败:', '${fullUrl}'); this.style.display='none';"
                                 onload="this.style.opacity='1'; this.setAttribute('data-loaded', 'true'); manager.cropWhiteBackground(this);"
                                 oncontextmenu="event.stopPropagation();"
                                 style="pointer-events: auto; position: relative; z-index: 0; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; opacity: 0; transition: opacity 0.2s ease;">
                        </div>
                    `;
                    imagesContainer.innerHTML = `<div class="image-grid">${imageHtml}</div>`;
                    
                    // 处理已加载的图片（从缓存中加载的）
                    setTimeout(() => {
                        const img = imagesContainer.querySelector('img');
                        if (img && img.complete && !img.hasAttribute('data-loaded')) {
                            img.style.opacity = '1';
                            img.setAttribute('data-loaded', 'true');
                        }
                    }, 50);
                    
                    // 隐藏底部缩略图列表
                    bottomThumbnailsContainer.style.display = 'none';
                } else {
                    imagesContainer.innerHTML = '<div style="text-align: center; padding: 50px; color: #757575;">无图片</div>';
                    bottomThumbnailsContainer.style.display = 'none';
                }

                // 渲染参数信息
                const paramsContainer = document.getElementById('taskDetailParams');
                paramsContainer.innerHTML = this.renderGenerationParams(task, duration);

                // 对已加载的图片应用裁剪
                setTimeout(() => {
                    const images = imagesContainer.querySelectorAll('img');
                    images.forEach(img => {
                        if (img.complete) {
                            this.cropWhiteBackground(img);
                        }
                    });
                }, 100);
            }

            // 渲染底部缩略图列表
            renderBottomThumbnails(urls, taskId) {
                const bottomThumbnailsContainer = document.getElementById('taskDetailBottomThumbnails');
                const thumbnailsHtml = urls.map((url, index) => {
                    const fullUrl = this.getImageUrl(url);
                    return `
                    <div class="thumbnail-item ${index === this.currentImageIndex ? 'active' : ''}" 
                         onclick="manager.switchToImage(${index}, '${taskId}')">
                        <img src="${fullUrl}" alt="缩略图 ${index + 1}" loading="lazy" onerror="console.error('缩略图加载失败:', '${fullUrl}');">
                    </div>
                `;
                }).join('');
                bottomThumbnailsContainer.innerHTML = thumbnailsHtml;
            }

            // 切换显示的图片
            switchToImage(index, taskId) {
                const task = this.tasks[taskId];
                if (!task || !task.result_urls || index < 0 || index >= task.result_urls.length) {
                    return;
                }

                this.currentImageIndex = index;
                
                // 更新主图片
                const imagesContainer = document.getElementById('taskDetailImages');
                const currentUrl = this.getImageUrl(task.result_urls[index]);
                const imageHtml = `
                    <div class="image-grid-item" style="position: relative; min-height: 200px; max-height: 100%;">
                        <img src="${currentUrl}" 
                             alt="生成结果 ${index + 1}" 
                             loading="lazy"
                             onload="this.style.opacity='1'; this.setAttribute('data-loaded', 'true'); manager.cropWhiteBackground(this);"
                             oncontextmenu="event.stopPropagation();"
                             style="pointer-events: auto; position: relative; z-index: 0; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; opacity: 0; transition: opacity 0.2s ease;">
                    </div>
                `;
                imagesContainer.innerHTML = `<div class="image-grid">${imageHtml}</div>`;
                
                // 处理已加载的图片（从缓存中加载的）
                setTimeout(() => {
                    const img = imagesContainer.querySelector('img');
                    if (img && img.complete && !img.hasAttribute('data-loaded')) {
                        img.style.opacity = '1';
                        img.setAttribute('data-loaded', 'true');
                    }
                }, 50);
                
                // 更新底部缩略图的激活状态
                const thumbnails = document.querySelectorAll('.thumbnail-item');
                thumbnails.forEach((thumb, i) => {
                    if (i === index) {
                        thumb.classList.add('active');
                    } else {
                        thumb.classList.remove('active');
                    }
                });
                
                // 对已加载的图片应用裁剪
                setTimeout(() => {
                    const images = imagesContainer.querySelectorAll('img');
                    images.forEach(img => {
                        if (img.complete) {
                            this.cropWhiteBackground(img);
                        }
                    });
                }, 100);
            }

            // 渲染预览列表
            renderPreviewList(currentTaskId) {
                const previewContainer = document.getElementById('taskDetailPreviewList');
                
                // 获取所有已完成的任务
                const completedTasks = Object.values(this.tasks).filter(task => 
                    task.status === 'completed' && (task.result_url || (task.result_urls && task.result_urls.length > 0))
                ).sort((a, b) => {
                    // 按创建时间倒序排列
                    const timeA = new Date(a.created_at || 0).getTime();
                    const timeB = new Date(b.created_at || 0).getTime();
                    return timeB - timeA;
                });

                if (completedTasks.length === 0) {
                    previewContainer.innerHTML = '<div style="text-align: center; color: #757575; font-size: 0.9rem;">暂无任务</div>';
                    return;
                }

                const previewHtml = completedTasks.map(task => {
                    // 获取第一张图片作为缩略图
                    let thumbnailUrl = '';
                    if (task.result_urls && task.result_urls.length > 0) {
                        thumbnailUrl = this.getImageUrl(task.result_urls[0]);
                    } else if (task.result_url) {
                        thumbnailUrl = this.getImageUrl(task.result_url);
                    }

                    const isActive = task.task_id === currentTaskId;
                    return `
                        <div class="preview-item ${isActive ? 'active' : ''}" 
                             onclick="event.stopPropagation(); manager.renderTaskDetail('${task.task_id}'); manager.updatePreviewActive('${task.task_id}')">
                            ${thumbnailUrl ? `<img src="${thumbnailUrl}" alt="预览" loading="lazy">` : '<div style="width: 100%; height: 100%; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; color: #757575; font-size: 0.8rem;">无图</div>'}
                        </div>
                    `;
                }).join('');

                previewContainer.innerHTML = previewHtml;
            }

            // 更新预览列表的激活状态
            updatePreviewActive(taskId) {
                const previewItems = document.querySelectorAll('.preview-item');
                previewItems.forEach(item => {
                    item.classList.remove('active');
                });
                
                const activeItem = Array.from(previewItems).find(item => {
                    const onclick = item.getAttribute('onclick');
                    return onclick && onclick.includes(`'${taskId}'`);
                });
                
                if (activeItem) {
                    activeItem.classList.add('active');
                    // 滚动到激活项（在预览容器内）
                    const previewContainer = document.querySelector('.task-detail-preview');
                    if (previewContainer) {
                        const containerRect = previewContainer.getBoundingClientRect();
                        const itemRect = activeItem.getBoundingClientRect();
                        const scrollTop = previewContainer.scrollTop || 0;
                        const itemTop = itemRect.top - containerRect.top + scrollTop;
                        previewContainer.scrollTo({
                            top: itemTop - previewContainer.offsetHeight / 2 + activeItem.offsetHeight / 2,
                            behavior: 'smooth'
                        });
                    }
                }
            }

            syncParamsHeight() {
                // 参数区域已使用固定高度（200px），内容可以滚动查看完整信息
                // 不再需要应用截断样式，让文字完整显示
                requestAnimationFrame(() => {
                    setTimeout(() => {
                        const resultContainers = document.querySelectorAll('.result-container');
                        resultContainers.forEach(container => {
                            const paramsContent = container.querySelector('.generation-params .params-content');
                            
                            if (paramsContent) {
                                // 确保参数值可以完整显示，不截断
                                const paramValues = paramsContent.querySelectorAll('.param-value');
                                paramValues.forEach(value => {
                                    value.style.display = 'block';
                                    value.style.overflow = 'visible';
                                    value.style.webkitLineClamp = 'unset';
                                    value.style.webkitBoxOrient = 'unset';
                                    value.style.textOverflow = 'unset';
                                    value.style.maxHeight = 'none';
                                });
                            }
                        });
                        
                        // 监听图片加载，图片加载完成后重新同步高度并计算容器宽度
                        const images = document.querySelectorAll('.result-container .image-grid-item img');
                        let loadedCount = 0;
                        const totalImages = images.length;
                        
                        // 根据图片实际比例计算容器宽度
                        const adjustImageContainerWidth = (img) => {
                            const container = img.closest('.image-grid-item');
                            const imageGrid = container?.closest('.image-grid');
                            // 如果是4张1:1图片的布局，不调整宽度（由CSS固定）
                            if (imageGrid && imageGrid.classList.contains('image-grid-4x1')) {
                                return;
                            }
                            if (container && img.naturalWidth && img.naturalHeight) {
                                const aspectRatio = img.naturalWidth / img.naturalHeight;
                                const fixedHeight = 500;
                                const calculatedWidth = fixedHeight * aspectRatio;
                                // 限制最大宽度，防止大图闪现
                                const maxWidth = container.closest('.result-container')?.offsetWidth || window.innerWidth;
                                const finalWidth = Math.min(calculatedWidth, maxWidth - 20); // 减去padding和gap
                                container.style.width = finalWidth + 'px';
                                container.style.maxWidth = finalWidth + 'px';
                            }
                        };
                        
                        if (totalImages === 0) {
                            // 没有图片，立即同步
                            setTimeout(() => this.syncParamsHeight(), 200);
                        } else {
                            images.forEach(img => {
                                if (!img.hasAttribute('data-sync-listener')) {
                                    img.setAttribute('data-sync-listener', 'true');
                                    if (!img.complete) {
                                        img.addEventListener('load', () => {
                                            adjustImageContainerWidth(img);
                                            loadedCount++;
                                            if (loadedCount === totalImages) {
                                                // 所有图片加载完成，同步高度
                                                setTimeout(() => this.syncParamsHeight(), 200);
                                            }
                                        }, { once: true });
                                    } else {
                                        adjustImageContainerWidth(img);
                                        loadedCount++;
                                        if (loadedCount === totalImages) {
                                            // 所有图片已加载，立即同步
                                            setTimeout(() => this.syncParamsHeight(), 200);
                                        }
                                    }
                                }
                            });
                        }
                    }, 50);
                });
            }
        }

            modalImg.style.width = 'auto';

                document.removeEventListener('keydown', manager.taskNavigationHandler);

        // 工作流切换函数
        function switchWorkflow() {
            const workflowType = document.getElementById('workflowType').value;
            const imageUploadGroup = document.getElementById('imageUploadGroup');
            const promptGroup = document.getElementById('promptGroup');
            const negativePromptGroup = document.getElementById('negativePromptGroup');
            const sizeGroup = document.getElementById('sizeGroup');
            const samplingGroup = document.getElementById('samplingGroup');
            const advancedGroup = document.getElementById('advancedGroup');
            const img2imgParams = document.getElementById('img2imgParams');

            // 隐藏所有特殊参数
            img2imgParams.style.display = 'none';

            switch(workflowType) {
                case 'qwen_text2img':
                    // Qwen 文生图：不需要上传图片
                    imageUploadGroup.style.display = 'none';
                    promptGroup.style.display = 'block';
                    negativePromptGroup.style.display = 'block';
                    sizeGroup.style.display = 'grid';
                    samplingGroup.style.display = 'grid';
                    advancedGroup.style.display = 'grid';
                    break;

                case 'qwen_img2img':
                    // Qwen 图生图：需要上传图片，支持多张
                    imageUploadGroup.style.display = 'block';
                    promptGroup.style.display = 'block';
                    negativePromptGroup.style.display = 'block';
                    sizeGroup.style.display = 'grid';
                    samplingGroup.style.display = 'grid';
                    advancedGroup.style.display = 'grid';
                    img2imgParams.style.display = 'block';
                    break;

                case 'rembg':
                    // 角色抠图：只需要上传图片
                    imageUploadGroup.style.display = 'block';
                    promptGroup.style.display = 'none';
                    negativePromptGroup.style.display = 'none';
                    sizeGroup.style.display = 'none';
                    samplingGroup.style.display = 'none';
                    advancedGroup.style.display = 'none';
                    break;
            }
        }

        // 设置多个图片上传区域
        function setupMultipleImageUploads() {
            // 第2张图片
            const imageUploadArea2 = document.getElementById('imageUploadArea2');
            const inputImage2 = document.getElementById('inputImage2');
            const uploadContent2 = document.getElementById('uploadContent2');
            const imagePreview2 = document.getElementById('imagePreview2');
            const previewImg2 = document.getElementById('previewImg2');

            imageUploadArea2.addEventListener('click', () => inputImage2.click());
            inputImage2.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImg2.src = e.target.result;
                        uploadContent2.style.display = 'none';
                        imagePreview2.style.display = 'flex';
                    };
                    reader.readAsDataURL(file);
                }
            });

            // 第3张图片
            const imageUploadArea3 = document.getElementById('imageUploadArea3');
            const inputImage3 = document.getElementById('inputImage3');
            const uploadContent3 = document.getElementById('uploadContent3');
            const imagePreview3 = document.getElementById('imagePreview3');
            const previewImg3 = document.getElementById('previewImg3');

            imageUploadArea3.addEventListener('click', () => inputImage3.click());
            inputImage3.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImg3.src = e.target.result;
                        uploadContent3.style.display = 'none';
                        imagePreview3.style.display = 'flex';
                    };
                    reader.readAsDataURL(file);
                }
            });
        }
