<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOJO AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&family=Noto+Sans+SC:wght@300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #000000;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        .header {
            background-color: #000000; /* 🎯 使用页面背景色：黑色 */
            background-image: none; /* 🎯 移除背景图片 */
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 0 30px;
            border-radius: 0;
            margin: 0;
            text-align: left;
            width: 100%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            height: 55px;
            z-index: 1000;
            border-bottom: 1px solid #333333; /* 🎯 底部添加细分割线 */
        }

        .container {
            max-width: none;
            margin: 0;
            padding: 0;
            padding-top: 55px; /* 为固定header留出空间 */
        }


        .header h1 {
            color: #ffffff; /* 🎯 改为白色 */
            font-size: 1.152rem; /* 🎯 缩小20%：从1.44rem改为1.152rem (1.44 * 0.8) */
            margin: 0;
            padding: 0;
            font-weight: 700;
            font-family: 'Sora', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            letter-spacing: 2px;
            line-height: 1;
        }

        .header p {
            display: none;
        }

        /* 任务统计链接样式 */
        .stats-link {
            color: #000000;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 4px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .stats-link:hover {
            background: rgba(0, 0, 0, 0.1);
            color: #80A5A0;
        }

        .layout-toggle {
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 4px;
            background: rgba(128, 165, 160, 0.1);
            border: 1px solid rgba(128, 165, 160, 0.3);
            color: #80A5A0;
            font-size: 18px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 36px;
            height: 28px;
        }

        .layout-toggle:hover {
            background: rgba(128, 165, 160, 0.2);
            border-color: rgba(128, 165, 160, 0.5);
            color: #a0c5c0;
        }

        .layout-toggle.active {
            background: rgba(128, 165, 160, 0.3);
            border-color: #80A5A0;
        }

        /* 统计弹窗样式 */
        .stats-modal {
            display: none;
            position: fixed;
            z-index: 3000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        .stats-modal-content {
            background: #1e1e1e;
            border: 1px solid #333333;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        .stats-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333333;
        }

        .stats-modal-header h2 {
            color: #F9FBFC;
            font-size: 1.5rem;
            margin: 0;
            font-weight: 600;
        }

        .stats-modal-close {
            color: #757575;
            font-size: 28px;
            font-weight: 300;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s ease;
        }

        .stats-modal-close:hover {
            color: #F9FBFC;
        }

        .stats-modal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .stats-modal-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333333;
            text-align: center;
            transition: all 0.2s ease;
        }

        .stats-modal-card:hover {
            border-color: #80A5A0;
            background: rgba(128, 165, 160, 0.1);
        }

        .stats-modal-number {
            font-size: 2rem;
            font-weight: 700;
            color: #80A5A0;
            margin-bottom: 8px;
            line-height: 1;
        }

        .stats-modal-label {
            font-size: 0.9rem;
            color: #b0bec5;
            font-weight: 500;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: transparent;
            padding: 20px 15px;
            border-radius: 0;
            text-align: center;
            border: 1px solid #333333;
        }

        .stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #80A5A0;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #b0bec5;
            font-size: 0.9rem;
        }

        .main-grid {
            display: flex; /* 🎯 改为 flex 布局以支持拖拽调整 */
            height: calc(100vh - 55px); /* 减去header高度 */
            overflow: hidden;
        }

        /* 拖拽分割线 */
        .resizer {
            width: 4px;
            background: #333333;
            cursor: col-resize;
            z-index: 100;
            transition: background 0.2s;
            flex-shrink: 0; /* 防止被压缩 */
        }

        .resizer:hover, .resizer.active {
            background: #80A5A0;
        }

        [data-theme="light"] .resizer {
            background: #E0E0E0;
        }

        [data-theme="light"] .resizer:hover,
        [data-theme="light"] .resizer.active {
            background: #5F8D87;
        }

        .panel {
            background: transparent;
            border-radius: 0;
            padding: 0; /* 🎯 移除内边距，交给子元素控制 */
            /* border-right: 1px solid #333333; 移除原来的边框，用resizer代替 */
            border-right: none;
            overflow: hidden; /* 🎯 禁止面板本身滚动 */
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .panel-content {
            flex: 1; /* 🎯 占据剩余空间 */
            overflow-y: auto; /* 🎯 只在这里滚动 */
            padding: 20px 40px; /* 🎯 固定边距：上下20px，左右40px */
            padding-bottom: 20px; /* 底部留一点间距，避免紧贴按钮栏 */
        }

        .panel:first-child {
            background: #101010;
            position: relative;
            /* padding: 25px 30px 100px 30px !important; 移除了，不再需要 */
            box-sizing: border-box;
            width: 30%; /* 🎯 默认初始宽度 30% */
            min-width: 320px; /* 🎯 最小宽度限制 */
            max-width: 60%; /* 🎯 最大宽度限制 */
        }

        /* 滚动条样式适配 */
        .panel-content::-webkit-scrollbar {
            width: 6px;
        }

        .panel-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel-content::-webkit-scrollbar-thumb {
            background: transparent;
            border-radius: 3px;
        }

        .panel-content:hover::-webkit-scrollbar-thumb {
            background: rgba(128, 165, 160, 0.3);
        }

        .panel-content::-webkit-scrollbar-thumb:hover {
            background: rgba(128, 165, 160, 0.5);
        }

        /* 暴力修复右侧滚动 */
        #rightPanel {
            overflow-y: scroll !important; /* 强制显示滚动条 */
            height: 100% !important;
            flex: 1 !important;
            pointer-events: auto !important; /* 确保可交互 */
            padding: 20px 40px !important; /* 🎯 增加边距：上下20px，左右40px */
            box-sizing: border-box !important; /* 确保 padding 包含在宽度内 */
        }

        /* 确保任务列表内容能撑开高度 */
        #taskList {
            min-height: 100%;
            height: auto !important;
            overflow: visible !important;
        }
        
        /* 隐藏右侧面板滚动条 */
        .panel:last-child::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Edge */
        }

        .panel h2 {
            color: #F9FBFC;
            margin-bottom: 20px;
            padding-bottom: 0;
            font-size: 1.1rem;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .form-section {
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            margin-bottom: 12px;
            font-weight: 600;
            color: #e0e0e0;
            font-size: 0.85rem;
            opacity: 0.5;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #333333;
            border-radius: 8px;
            font-size: 14px;
            background: transparent;
            color: #e0e0e0;
            transition: border-color 0.2s ease;
        }

        /* 隐藏所有数字输入框的上下箭头 */
        input[type="number"] {
            -moz-appearance: textfield; /* Firefox */
            appearance: textfield; /* 标准属性 */
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none; /* Chrome, Safari, Edge */
            margin: 0;
        }

        /* 工作流类型下拉框样式，与底部尺寸下拉框保持一致 */
        .form-group select {
            -webkit-appearance: none; /* Chrome, Safari, Edge */
            -moz-appearance: none; /* Firefox */
            appearance: none; /* 标准属性 */
            cursor: pointer;
            position: relative;
            z-index: 2;
            /* 使用与aspect-ratio-select相同的自定义箭头 */
            background-image: url("data:image/svg+xml;charset=utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e0e0e0' stroke-width='1.5'><polyline points='6,9 12,15 18,9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
            padding-right: 40px; /* 为箭头留出空间 */
        }

        .form-group select:hover {
            border-color: #666666;
        }

        .form-group select:focus {
            border-color: #80A5A0;
            outline: none;
            z-index: 1000; /* 确保下拉框打开时，选项列表显示在最上层 */
        }

        .form-group select option {
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 8px 12px;
        }

        .form-group select option:checked {
            background: #80A5A0;
            color: #000000;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #80A5A0;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #666666;
        }

        .form-group textarea {
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
            resize: vertical;
        }

        .form-group textarea::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        .form-group input[type="file"] {
            padding: 12px 16px;
        }

        .image-upload-area {
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 24px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
            background: transparent;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-upload-area:hover {
            border-color: #80A5A0;
        }

        .image-upload-area.dragover {
            border-color: #80A5A0;
        }

        .upload-content {
            width: 100%;
        }

        .upload-icon {
            margin-bottom: 4px;
            opacity: 0.3;
            display: flex;
            justify-content: center;
        }

        .upload-icon svg {
            color: #e0e0e0;
        }

        .upload-main-text {
            font-size: 0.85rem;
            color: #e0e0e0;
            margin-bottom: 0;
            font-weight: 400;
            opacity: 0.3;
        }

        .image-preview {
            width: 100%;
            position: relative;
        }

        .image-preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 6px;
            object-fit: contain;
        }

        .image-actions {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-delete {
            background: transparent;
            border: none;
            padding: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #888888;
            border-radius: 4px;
        }

        .btn-delete:hover {
            background: rgba(136, 136, 136, 0.1);
            color: #aaaaaa;
        }

        .btn-delete svg {
            display: block;
        }

        .upload-hint {
            font-size: 0.75rem;
            color: #666666;
            margin: 0;
        }

        /* 滚动条样式 */
        .panel::-webkit-scrollbar {
            width: 6px;
        }

        .panel::-webkit-scrollbar-track {
            background: transparent;
        }

        .panel::-webkit-scrollbar-thumb {
            background: transparent;
            border-radius: 3px;
        }

        .panel:hover::-webkit-scrollbar-thumb {
            background: rgba(128, 165, 160, 0.3);
        }

        .panel::-webkit-scrollbar-thumb:hover {
            background: rgba(128, 165, 160, 0.5);
        }


        .btn {
            background: transparent;
            color: #80A5A0;
            border: 1px solid #80A5A0;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: #80A5A0;
            color: #000000;
        }

        .btn-fixed-bottom {
            width: 100px;
            height: 40px;
            background: #99D1CA;
            color: #000000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            flex-shrink: 0;
        }

        .btn-fixed-bottom:hover {
            background: #7BC4BB;
            color: #000000;
        }

        .btn-fixed-bottom::before {
            display: none;
        }

        /* 底部固定控制栏调整 - Flexbox 方案 */
        .bottom-controls-wrapper {
            flex-shrink: 0; /* 🎯 禁止压缩，保持高度 */
            background: #101010;
            border-top: 1px solid #333333;
            padding: 20px 40px; /* 🎯 底部按钮栏也同步改为左右40px，与上方内容对齐 */
            z-index: 50;
            width: 100%;
            box-sizing: border-box;
            min-height: 80px; /* 🎯 确保最小高度 */
        }

        .bottom-controls {
            /* 移除所有定位属性，还原为普通Flex容器 */
            position: static;
            width: 100%;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin: 0;
            padding: 0;
        }

        /* 移除旧的 .bottom-background 样式 */
        .bottom-background {
            display: none;
        }

        [data-theme="light"] .bottom-controls-wrapper {
            background: #FFFFFF;
            border-top-color: #E0E0E0;
        }

        .aspect-ratio-select {
            background: transparent;
            border: 1px solid #333333;
            border-radius: 8px;
            color: #e0e0e0;
            padding: 8px 24px 8px 12px;
            font-size: 14px;
            cursor: pointer;
            width: 150px;
            height: 40px;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e0e0e0' stroke-width='1.5'><polyline points='6,9 12,15 18,9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
            background-size: 14px;
            transition: border-color 0.2s ease;
            flex-shrink: 0;
        }

        .aspect-ratio-select:focus {
            border-color: #80A5A0;
            outline: none;
        }

        .aspect-ratio-select:hover {
            border-color: #666666;
        }

        .aspect-ratio-select option {
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 8px 12px;
        }

        .aspect-ratio-select option:checked {
            background: #80A5A0;
            color: #000000;
        }

        /* 任务监控展开收起样式 */
        .monitoring-header {
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            transition: color 0.2s ease;
        }

        .monitoring-header:hover {
            color: #99D1CA;
        }

        .collapse-arrow {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
            opacity: 0.7;
        }

        .collapse-arrow.collapsed {
            transform: rotate(-90deg);
        }

        .stats-container {
            overflow: hidden;
            transition: max-height 0.3s ease, opacity 0.2s ease, margin-bottom 0.3s ease;
            max-height: 300px;
            opacity: 1;
            margin-bottom: 15px;
        }

        .stats-container.collapsed {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
        }

        .stats-grid {
            transition: transform 0.3s ease;
        }

        .btn-secondary {
            color: #b0bec5;
            border-color: #b0bec5;
        }

        .btn-secondary:hover {
            background: #b0bec5;
            color: #000000;
        }

        .btn-success {
            color: #4caf50;
            border-color: #4caf50;
        }

        .btn-success:hover {
            background: #4caf50;
            color: #000000;
        }

        .btn-danger {
            color: #f44336;
            border-color: #f44336;
        }

        .btn-danger:hover {
            background: #f44336;
            color: #F9FBFC;
        }

        .task-list {
            overflow: visible; /* 移除滚动，让内容自然扩展 */
            flex: 0 0 auto; /* 根据内容自然高度，不占用flex空间 */
            padding: 0; /* 移除上下边距 */
            margin: 0; /* 移除所有外边距 */
        }

        /* 宫格布局样式 - 瀑布流布局 */
        .task-list.grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); /* 🎯 列宽240px */
            grid-auto-rows: 1px; /* 使用1px作为基础行高单位 */
            grid-auto-flow: dense; /* 密集排列，填充空隙 */
            gap: 4px !important; /* 图片之间4px间距 */
            row-gap: 4px !important; /* 纵向间距4px */
            column-gap: 4px !important; /* 横向间距4px */
            padding: 0 !important;
            margin: 0 !important;
        }

        .task-list.grid-layout .task-item {
            margin: 0 !important;
            margin-bottom: 0 !important;
            margin-top: 0 !important;
            background: transparent;
            border: none;
            padding: 0 !important;
            grid-column: span 1; /* 每张图片占据1列 */
            position: relative;
        }

        .task-list.grid-layout .task-item-grid {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 150px; /* 🚀 兜底高度，防止图片计算未完成时不可见 */
            cursor: pointer;
            overflow: hidden;
            background: transparent !important; /* 透明背景，无间距 */
            display: block;
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            box-sizing: border-box;
        }

        .task-list.grid-layout .task-item-grid img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover; /* 填充容器，保持比例 */
            transition: transform 0.3s ease, opacity 0.2s ease;
            opacity: 1; /* 🚀 强制默认可见，防止JS加载检测失效导致图片隐藏 */
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
        }

        .task-list.grid-layout .task-item-grid img[data-loaded="true"] {
            opacity: 1;
        }

        .task-list.grid-layout .task-item-grid:hover img {
            transform: scale(1.02);
        }

        .task-list.grid-layout .task-header-left,
        .task-list.grid-layout .task-header-right,
        .task-list.grid-layout .prompt-only,
        .task-list.grid-layout .task-details .workflow-title,
        .task-list.grid-layout .task-header {
            display: none !important;
        }
        
        /* 🎯 关键修复：Grid模式下，task-details 必须保留，但要重置样式，
           因为 renderResultImages 生成的内容在 details 里 (在 list 模式下)。
           但在 grid 模式下，我们直接把 image 放在 task-item 下，不包 task-details。
           如果由于缓存原因 task-details 还在，我们需要让它透明化。
        */
        .task-list.grid-layout .task-details {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
            background: transparent !important;
            display: block !important; /* 保持显示，因为里面可能有图片 */
        }
        
        /* 移除第一个任务项的顶部间距 */
        .task-list > .task-item:first-child {
            margin-top: 0;
        }

        .task-item {
            background: transparent;
            border-radius: 0;
            padding: 0;
            margin-bottom: 60px; /* 🎯 间距增加一倍：从30px改为60px */

            align-items: flex-start;

        .image-grid-item {
            position: relative;
            height: 100%;
            width: 100%;
            min-height: 400px; /* 🎯 最小高度：缩小20%（从500px改为400px），防止初始渲染时尺寸错误 */
            max-height: 100%; /* 最大高度限制 */
            max-width: 100%; /* 最大宽度限制，防止大图闪现 */
            border-radius: 12px; /* 🎯 恢复圆角，更像Pinterest */
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center; /* 图片居中 */
            box-sizing: border-box; /* 确保尺寸计算包含border */
            contain: layout style paint; /* 🎯 优化渲染性能，避免布局重排 */
            transition: transform 0.2s ease, box-shadow 0.2s ease; /* 🎯 添加悬停动画 */
        }
        
        .image-grid-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            border-color: #80A5A0;
        }

        .image-grid-item img {
            max-width: 100% !important; /* 强制限制最大宽度 */
            max-height: 100% !important; /* 强制限制最大高度 */
            width: auto;
            height: auto;
            object-fit: contain; /* 保持比例，居中显示 */
            display: block; /* 避免内联元素的默认行为 */
            opacity: 1; /* 🚀 强制默认可见 */
            transition: opacity 0.2s ease; /* 淡入效果 */
            box-sizing: border-box; /* 确保尺寸计算正确 */
            contain: layout style paint; /* 🎯 优化渲染性能，避免布局重排 */
            will-change: opacity; /* 🎯 提示浏览器优化opacity变化 */
        }
        
        .image-grid-item img[complete],

            opacity: 1; /* 加载完成后显示 */
        }

        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;

            transform: translateY(100%);

    <script>
        // ================= 用户认证管理 =================
        class AuthManager {
            constructor() {
                this.apiKey = localStorage.getItem('hojo_api_key');
                this.currentUser = null;
                this.modal = document.getElementById('loginModal');
                this.input = document.getElementById('apiKeyInput');
                this.errorMsg = document.getElementById('loginError');
                
                // 绑定回车登录
                if(this.input) {
                    this.input.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') this.login();
                    });
                }
            }

            async init() {
                // 如果没有 Key，显示登录框
                if (!this.apiKey) {
                    this.showLogin();
                    return false;
                }
                
                // 如果有 Key，验证它
                const isValid = await this.verifyToken();
                if (isValid) {
                    this.hideLogin(); // 验证通过，隐藏登录框
                } else {
                    this.showLogin(); // 验证失败，显示登录框
                }
                return isValid;
            }

            showLogin() {
                if(this.modal) this.modal.style.display = 'flex';
            }

            hideLogin() {
                if(this.modal) this.modal.style.display = 'none';
            }

            async login() {
                const key = this.input.value.trim();
                if (!key) {
                    this.showError('请输入 API Key');
                    return;
                }
                
                // 显示加载状态
                const btn = this.modal.querySelector('button');
                const originalText = btn.textContent;
                btn.textContent = '验证中...';
                btn.disabled = true;
                this.showError(''); // 清除旧错误

                this.apiKey = key;
                if (await this.verifyToken()) {
                    localStorage.setItem('hojo_api_key', key);
                    this.hideLogin();
                    
                    // 🎯 核心优化：不刷新页面，直接初始化
                    console.log('🔄 登录成功，初始化系统...');
                    if (window.manager) {
                        window.manager.loadTasksFromLocalStorage();
                        window.manager.updateTaskList();
                        window.manager.startConnectionMonitor();
                    } else {
                        location.reload();
                    }
                } else {
                    this.showError('验证失败：无效的 Key 或连接超时');
                    // 保持输入框内容，不清除
                    this.apiKey = null;
                }
                
                // 恢复按钮
                btn.textContent = originalText;
                btn.disabled = false;
            }

            showError(msg) {
                if(this.errorMsg) {
                    this.errorMsg.textContent = msg;
                    this.errorMsg.style.display = 'block';
                }
            }

            async verifyToken() {
                try {
                    // 获取API地址，优先使用 input 的值，其次是默认值
                    const apiServerInput = document.getElementById('apiServer');
                    const apiServer = apiServerInput ? apiServerInput.value : 'http://localhost:8088';
                    
                    console.log(`🔐 正在验证 Token... 目标 API: ${apiServer}/me`);
                    
                    const response = await fetch(`${apiServer}/me`, {
                        headers: {
                            'Authorization': `Bearer ${this.apiKey}`
                        }
                    });

                    if (response.ok) {
                        this.currentUser = await response.json();
                        console.log('✅ 认证成功:', this.currentUser.username);
                        this.updateUI();
                        return true;
                    } else {
                        console.warn('❌ 认证失败 HTTP:', response.status);
                        if (response.status === 401) {
                            localStorage.removeItem('hojo_api_key');
                            // 不要在这里调用 showLogin，因为可能本来就在登录中
                        }
                        return false;
                    }
                } catch (e) {
                    console.error('验证连接异常:', e);
                    return false; 
                }
            }

            updateUI() {
                // 在Header显示用户名
                const header = document.querySelector('.header h1');
                if (header && this.currentUser) {
                    // 检查是否已存在
                    const existBadge = document.getElementById('userBadge');
                    if (existBadge) existBadge.remove();

                    // 创建容器
                    const userContainer = document.createElement('div');

            logout() {

            // 封装 Fetch 请求
            async fetch(url, options = {}) {
                // 确保 Headers 存在
                if (!options.headers) options.headers = {};
                
                // 注入 Auth Token
                if (this.apiKey) {
                    options.headers['Authorization'] = `Bearer ${this.apiKey}`;
                }

                const response = await fetch(url, options);

                // 处理 401 (Token 过期/无效)
                if (response.status === 401) {
                    localStorage.removeItem('hojo_api_key');
                    this.showLogin();
                    throw new Error('Unauthorized');
                }

                return response;
            }
        }

        const authManager = new AuthManager();

        class BatchGenerationManager {
            constructor() {
                this.apiServer = 'http://127.0.0.1:8088'; // 默认使用IPv4，避免localhost解析问题
                this.ws = null;
                this.tasks = {};
                this.refreshInterval = null;
                this.apiConnected = false;
                this._manuallyPaused = false;
                this.retryCount = 0;

            updateThemeIcon() {

                if (icon) {
                    // ☀️ Sun for light mode (switch to dark), 🌙 Moon for dark mode (switch to light)
                    // 这里逻辑反一下：当前是dark，显示太阳代表"切换到浅色"；当前是light，显示月亮代表"切换到深色"
                    icon.innerHTML = this.themeMode === 'dark' ? '☀️' : '🌙';

                if (toggle) {

            // 保存任务到localStorage
            saveTaskToLocalStorage(taskId, taskData) {
                try {
                    const key = `task_${taskId}`;
                    localStorage.setItem(key, JSON.stringify(taskData));
                    console.log('💾 本地保存任务参数:', taskId);
                } catch (error) {
                    console.warn('⚠️ localStorage保存失败:', error);
                }
            }

            // 从localStorage加载所有任务
            loadTasksFromLocalStorage() {
                try {
                    const savedTasks = {};
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && key.startsWith('task_')) {
                            const taskId = key.substring(5);
                            const taskData = JSON.parse(localStorage.getItem(key));
                            savedTasks[taskId] = taskData;
                        }
                    }
                    
                    if (Object.keys(savedTasks).length > 0) {
                        console.log('📥 从localStorage恢复任务参数:', Object.keys(savedTasks).length, '个');
                        this.tasks = savedTasks;
                    }
                } catch (error) {
                    console.warn('⚠️ localStorage加载失败:', error);
                }
            }


            async init() {
                // 等待用户认证
                if (!await authManager.init()) {
                    console.log('等待用户登录...');
                    return;
                }

                console.log('🚀 [INIT] 开始初始化...');
                
                // 🚀 启动时强制初始化 UI 状态
                this.initTheme();
                this.initDragResizer();
                this.initLayoutMode();
                this.initViewMode();
                this.updateLayoutToggle();
                this.toggleGenerationMode();
                this.syncParamsHeight();
                
                console.log('🚀 [INIT] 当前本地任务数量:', Object.keys(this.tasks).length);
                
                // 🎯 关键改进：图片显示与API状态完全解耦
                // 1. 立即渲染本地缓存的任务（不等待任何网络请求）
                const taskList = document.getElementById('taskList');
                if (taskList) taskList.innerHTML = '';
                
                if (Object.keys(this.tasks).length > 0) {
                    console.log('🚀 [INIT] 立即渲染本地缓存任务');
                    this.updateTaskList();
                    this.updateStats();
                }
                
                // 2. 独立的API连接状态检测（不影响图片显示）
                this.startConnectionMonitor();
                
                // 3. 独立的任务刷新（静默失败，不影响UI）
                this.refreshTasks();
                
                // 4. 定时刷新任务（30秒）
                setInterval(() => this.refreshTasks(), 30000);
                
                // 5. 尝试连接WebSocket（可选）
                this.connectWebSocket();

            // 🎯 新增：独立的连接状态监控器
            startConnectionMonitor() {
                // 立即检测一次
                this.testApiConnection();
                
                // 每10秒检测一次连接状态（独立于任务刷新）
                setInterval(() => {
                    this.testApiConnection();
                }, 10000);
            }

            // 初始化布局模式
            initLayoutMode() {
                const savedLayout = localStorage.getItem('imageListLayout');
                if (savedLayout === 'grid' || savedLayout === 'list') {
                    this.layoutMode = savedLayout;
                } else {
                    this.layoutMode = 'grid'; // 默认网格模式
                }
                
                const taskList = document.getElementById('taskList');

                        taskList.classList.add('grid-layout');

                    }

                this.updateLayoutToggle();
            }
            
            // 初始化视图模式
            initViewMode() {
                // 默认显示所有，不持久化ViewMode，每次重置
                this.viewMode = 'all';
                this.updateTaskMonitorTitle();
            }

            // 拖拽分割线逻辑
            initDragResizer() {
                const resizer = document.getElementById('dragResizer');
                const leftPanel = document.getElementById('leftPanel');
                const rightPanel = document.getElementById('rightPanel');
                const container = document.querySelector('.main-grid');
                
                if (!resizer || !leftPanel || !rightPanel || !container) return;

                let isResizing = false;
                
                // 恢复上次保存的宽度
                const savedWidth = localStorage.getItem('leftPanelWidth');
                if (savedWidth) {
                    leftPanel.style.width = savedWidth;
                    leftPanel.style.flex = 'none'; 
                }

                resizer.addEventListener('mousedown', (e) => {
                    isResizing = true;
                    resizer.classList.add('active');
                    document.body.style.userSelect = 'none';
                    document.body.style.cursor = 'col-resize';
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isResizing) return;

                    const containerRect = container.getBoundingClientRect();
                    const containerWidth = containerRect.width;
                    
                    // 计算鼠标相对于容器左侧的偏移量
                    let newLeftWidth = e.clientX - containerRect.left;
                    
                    // 限制最小和最大宽度（像素）
                    const minWidth = 320;
                    const maxWidth = containerWidth - 400; // 右侧最少保留400px

                    if (newLeftWidth < minWidth) newLeftWidth = minWidth;
                    if (newLeftWidth > maxWidth) newLeftWidth = maxWidth;

                    // 转换为百分比
                    const newWidthPercent = (newLeftWidth / containerWidth) * 100;
                    
                    leftPanel.style.width = `${newWidthPercent}%`;
                    leftPanel.style.flex = 'none'; // 禁用flex-grow/shrink，强制使用width
                });

                document.addEventListener('mouseup', (e) => {
                    if (isResizing) {
                        isResizing = false;
                        resizer.classList.remove('active');
                        document.body.style.userSelect = '';
                        document.body.style.cursor = '';
                        
                        // 保存宽度到本地存储
                        localStorage.setItem('leftPanelWidth', leftPanel.style.width);
                        
                        // 如果在Grid模式下，可能需要重新触发布局调整
                        if (this.layoutMode === 'grid') {
                            // 延迟一点时间，等待DOM重排
                            setTimeout(() => {
                                const gridImages = document.querySelectorAll('.task-list.grid-layout .task-item-grid img');
                                gridImages.forEach(img => {
                                    if (img.complete) this.adjustGridItemHeight(img);
                                });
                            }, 100);
                        }
                    }
                });
            }
            
            async testApiConnection() {
                try {
                    // 🎯 创建超时控制器（5秒超时，更宽容）
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 5000);
                    
                    const response = await authManager.fetch(`${this.apiServer}/health`, {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);
                    
                    if (response.ok) {
                        const data = await response.json();
                        
                        // 🎯 只有状态真正改变时才更新UI，避免闪烁
                        if (!this.apiConnected) {
                            console.log('✅ API连接恢复');
                            this.apiConnected = true;
                            this.retryCount = 0;
                            this.updateApiStatus(true);
                        }
                        
                        // 更新ComfyUI服务器状态（独立显示）
                        this.updateComfyUIStatus(data);
                        
                        return true;
                    } else {
                        throw new Error(`HTTP ${response.status}`);
                    }
                } catch (error) {
                    // 🎯 只有状态真正改变时才更新UI
                    if (this.apiConnected) {
                        console.error('❌ API连接断开:', error.name === 'AbortError' ? '超时' : error.message);
                        this.apiConnected = false;
                        this.updateApiStatus(false, error.name === 'AbortError' ? '连接超时' : '连接失败');
                    }
                    return false;
                }
            }
            
            // 🎯 新增：更新ComfyUI状态（独立于API状态）
            updateComfyUIStatus(data) {
                if (!data.comfyui_server) return;
                
                const comfyuiStatus = document.getElementById('comfyuiStatus');
                const comfyuiStatusInfo = document.getElementById('comfyuiStatusInfo');
                
                if (data.comfyui_server === 'online') {
                    const statusText = `✅ 在线 (${data.comfyui_url || '已连接'})`;
                    if (comfyuiStatus) {
                        comfyuiStatus.textContent = `✅ ComfyUI: 在线`;
                        comfyuiStatus.className = 'connection-status connected';
                        comfyuiStatus.title = `ComfyUI服务器: ${data.comfyui_url || '未知'}`;
                    }
                    if (comfyuiStatusInfo) {
                        comfyuiStatusInfo.textContent = statusText;
                        comfyuiStatusInfo.style.color = '#80A5A0';
                    }
                } else {
                    const errorMsg = data.comfyui_error ? ` - ${data.comfyui_error}` : '';
                    if (comfyuiStatus) {
                        comfyuiStatus.textContent = `🔴 ComfyUI: 离线`;
                        comfyuiStatus.className = 'connection-status disconnected';
                        comfyuiStatus.title = `ComfyUI服务器连接失败: ${data.comfyui_url || '未知'}${errorMsg}`;
                    }
                    if (comfyuiStatusInfo) {
                        comfyuiStatusInfo.textContent = `🔴 离线${errorMsg}`;
                        comfyuiStatusInfo.style.color = '#c62828';
                    }
                }
            }

            startRefreshTimer() {
                if (this.refreshInterval) {
                    clearInterval(this.refreshInterval);
                }
                // 🎯 优化：增加刷新间隔到30秒，减少不必要的刷新和闪烁
                const refreshInterval = 30000; // 30秒刷新一次
                this.refreshInterval = setInterval(() => {
                    // 只有在没有生成中任务时才刷新，避免状态冲突
                    const hasGeneratingTasks = Object.values(this.tasks).some(task => task.status === 'generating' || task.status === 'running');
                    if (this.apiConnected && !hasGeneratingTasks) {
                        console.log('🔄 定期刷新（无生成中任务）');
                        this.refreshTasks();
                    } else if (hasGeneratingTasks) {
                        console.log('⏸️ 跳过定期刷新（有生成中任务）');
                    }
                }, refreshInterval);
            }

            stopRefreshTimer() {
                if (this.refreshInterval) {
                    clearInterval(this.refreshInterval);
                    this.refreshInterval = null;
                }
            }

            connectWebSocket() {
                // WebSocket 是可选的，如果后端不支持则静默失败
                // 任务状态更新通过轮询实现，不依赖 WebSocket
                const wsUrl = this.apiServer.replace('http', 'ws') + '/ws';
                
                try {
                    this.ws = new WebSocket(wsUrl);
                    
                    this.ws.onopen = () => {
                        console.log('WebSocket连接成功');
                        this.updateConnectionStatus(true);
                    };

                    this.ws.onmessage = (event) => {
                        const message = JSON.parse(event.data);
                        if (message.type === 'task_update') {
                            this.updateTask(message.data);
                        }
                    };

                    this.ws.onclose = () => {
                        // 静默处理，不显示错误
                        this.updateConnectionStatus(false);
                        
                        // 5秒后重连（如果 WebSocket 可用）
                        setTimeout(() => {
                            if (this.ws && this.ws.readyState === WebSocket.CLOSED) {
                            this.connectWebSocket();
                            }
                        }, 5000);
                    };

                    this.ws.onerror = (error) => {
                        // 静默处理 WebSocket 错误，不显示在控制台
                        // WebSocket 是可选的，任务状态通过轮询更新
                        this.updateConnectionStatus(false);
                    };

                } catch (error) {
                    // 静默处理连接失败
                    this.updateConnectionStatus(false);
                }
            }

            updateConnectionStatus(connected) {
                // WebSocket 状态更新，静默处理，不影响UI
                // 主要的连接状态由 API 调用来判断
                // 这样避免 WebSocket 连接失败导致的UI抖动
            }

            async apiCall(endpoint, method = 'GET', data = null, showError = false) {
                const url = `${this.apiServer}${endpoint}`;
                const options = {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                    },
                };

                if (data) {
                    options.body = JSON.stringify(data);
                }

                try {
                    const response = await authManager.fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    
                    // 🎯 API调用成功，重置重试计数（但不主动更新连接状态，由独立监控器负责）
                    if (this.retryCount > 0) {
                        this.retryCount = 0;
                        console.log('✅ API调用恢复正常，重置重试计数');
                    }
                    
                    return await response.json();
                } catch (error) {
                    // 🎯 静默失败：不因为任务刷新失败而改变连接状态
                    // 连接状态由独立的 testApiConnection() 监控器负责
                    console.warn('⚠️ API调用失败（不影响连接状态）:', error.message);
                    
                    // 只有在明确要求显示错误时才弹窗
                    if (showError) {
                        this.showErrorMessage(`API调用失败: ${error.message}`);
                    }
                    
                    throw error;
                }
            }

            showErrorMessage(message) {
                this.showToast(message, '#c62828');
            }

            showSuccessMessage(message) {
                this.showToast(message, '#80A5A0');
            }

            // 复制图片到剪贴板
            async copyImageToClipboard(imageUrl) {
                try {
                    // 获取图片
                    const response = await fetch(imageUrl);
                    const blob = await response.blob();
                    
                    // 复制到剪贴板
                    await navigator.clipboard.write([
                        new ClipboardItem({
                            [blob.type]: blob
                        })
                    ]);
                    
                    this.showSuccessMessage('图片已复制到剪贴板');
                } catch (error) {
                    console.error('复制图片失败:', error);
                    // 如果复制失败，尝试复制图片URL
                    try {
                        await navigator.clipboard.writeText(imageUrl);
                        this.showSuccessMessage('图片URL已复制到剪贴板');
                    } catch (urlError) {
                        this.showErrorMessage('复制失败，请手动复制图片');
                    }
                }
            }

                    status.title = `无法连接到服务器: ${this.apiServer}。请确认服务器地址是否正确，服务器是否正在运行。`;

            toggleLayout() {
                this.layoutMode = this.layoutMode === 'list' ? 'grid' : 'list';
                localStorage.setItem('imageListLayout', this.layoutMode);
                this.updateLayoutToggle();
                
                // 🎯 关键修复：切换布局时强制清空列表，确保DOM结构完全重建
                // 这能解决从List切到Grid时，旧的DOM结构（包含header等）残留导致的布局错乱
                const taskList = document.getElementById('taskList');

            updateLayoutToggle() {
                const toggle = document.getElementById('layoutToggle');

            async submitBatch() {
                console.log('🚀 开始提交批量任务...');
                
                const promptText = document.getElementById('prompt').value.trim();
                if (!promptText) {
                    this.showErrorMessage('请输入提示词');
                    return;
                }
                
                const prompts = promptText.split('\n').map(p => p.trim()).filter(p => p);
                
                if (prompts.length === 0) {
                    this.showErrorMessage('有效提示词为空');
                    return;
                }
                
                this.showSuccessMessage(`正在提交 ${prompts.length} 个批量任务...`);
                
                const width = parseInt(document.getElementById('width').value);
                const height = parseInt(document.getElementById('height').value);
                const steps = parseInt(document.getElementById('steps').value);
                const cfg = parseFloat(document.getElementById('cfg').value);
                const seed = document.getElementById('seed').value ? parseInt(document.getElementById('seed').value) : null;
                const batchSize = parseInt(document.getElementById('batchSize').value);
                const negativePrompt = document.getElementById('negativePrompt').value;
                // 获取 workflowType，如果不存在则默认 qwen
                let workflowType = 'qwen';
                const workflowTypeElem = document.getElementById('workflowType');
                if (workflowTypeElem) {
                    workflowType = workflowTypeElem.value;
                }

                const requests = prompts.map(prompt => ({
                    prompt: prompt,
                    negative_prompt: negativePrompt,
                    width: width,
                    height: height,
                    steps: steps,
                    cfg: cfg,
                    batch_size: batchSize,
                    seed: seed,
                    workflow_type: workflowType
                }));

                const batchRequest = {
                    requests: requests,
                    batch_name: `批量任务_${new Date().toLocaleTimeString()}`
                };

                try {
                    const result = await this.apiCall('/batch', 'POST', batchRequest, true);
                    console.log('✅ 批量任务提交成功:', result);
                    this.showSuccessMessage(`成功提交 ${result.task_ids.length} 个任务`);
                    
                    // 立即刷新任务列表以显示新任务
                    await this.refreshTasks();
                    
                    // 对每个新任务启动轮询
                    if (result.task_ids && Array.isArray(result.task_ids)) {

                        result.task_ids.forEach(taskId => {

                    console.error('❌ 批量任务提交失败:', error);
                    this.showErrorMessage('批量任务提交失败: ' + error.message);
                }
            }

            // 轮询单个任务状态
            async pollTaskStatus(taskId, maxAttempts = 300) { // 默认超时增加到10分钟
                let attempts = 0;
                const pollInterval = 2000; // 2秒轮询一次
                let consecutiveErrors = 0; // 连续错误计数
                const maxConsecutiveErrors = 5; // 最多连续5次错误后停止
                
                const poll = async () => {
                    try {
                        // 创建超时控制器
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 5000);
                        
                        const response = await authManager.fetch(`${this.apiServer}/status/${taskId}`, {
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: 获取任务状态失败`);
                        }
                        
                        const taskData = await response.json();
                        consecutiveErrors = 0; // 重置错误计数
                        
                        if (taskData.status === 'completed') {
                            // 任务完成，立即刷新获取完整数据
                            console.log(`🎉 任务 ${taskId} 完成`);
                            await this.refreshTasks();
                            this.showSuccessMessage('图片生成完成！');
                            return;
                        } else if (taskData.status === 'failed' || taskData.status === 'error') {
                            // 任务失败，直接清除任务
                            if (this.tasks[taskId]) {
                                delete this.tasks[taskId];
                                this.updateTaskList();
                                this.updateStats();
                            }
                            this.showErrorMessage(taskData.error || '图片生成失败');
                            return;
                        } else if (taskData.status === 'running' || taskData.status === 'pending' || taskData.status === 'generating') {
                            // 更新状态和进度信息
                            if (this.tasks[taskId]) {
                                const oldStatus = this.tasks[taskId].status;
                                this.tasks[taskId].status = taskData.status;
                                // 更新进度信息
                                if (taskData.progress !== undefined) {
                                    this.tasks[taskId].progress = taskData.progress;
                                }
                                if (taskData.message) {
                                    this.tasks[taskId].message = taskData.message;
                                }
                                // 只有当状态发生变化时才打印日志，避免控制台刷屏
                                if (oldStatus !== taskData.status) {
                                    console.log(`🔄 任务 ${taskId} 状态变更: ${oldStatus} -> ${taskData.status}`);
                                }
                                this.updateTaskList();
                            }
                        }
                        
                        // 继续轮询
                        // 🎯 智能超时策略：如果任务还在排队(pending)，不计入超时尝试次数
                        if (taskData.status !== 'pending') {
                            attempts++;
                        } else {
                            // 排队中，每10次轮询才算1次超时（大大延长排队容忍时间）
                            if (Math.random() < 0.1) attempts++;
                        }

                        if (attempts < maxAttempts) {
                            setTimeout(poll, pollInterval);
                        } else {
                            // 超时，直接清除任务
                            console.warn(`⏰ 任务 ${taskId} 轮询超时`);
                            if (this.tasks[taskId]) {
                                delete this.tasks[taskId];
                                this.updateTaskList();
                                this.updateStats();
                            }
                            this.showErrorMessage('任务超时，请检查服务器状态');
                            await this.refreshTasks();
                        }
                    } catch (error) {
                        console.error(`⚠️ 轮询任务状态失败 (${consecutiveErrors + 1}/${maxConsecutiveErrors}):`, error);
                        consecutiveErrors++;
                        
                        // 如果是网络错误，尝试重新测试API连接
                        if (error.name === 'AbortError' || error.message.includes('fetch')) {
                            console.warn('网络错误，尝试重新测试API连接...');
                            await this.testApiConnection();
                        }
                        
                        // 如果连续多次失败，可能是API关闭了，直接清除任务
                        if (consecutiveErrors >= maxConsecutiveErrors) {
                            console.warn(`❌ 任务 ${taskId} 连续${maxConsecutiveErrors}次轮询失败，停止轮询`);
                            if (this.tasks[taskId]) {
                                delete this.tasks[taskId];
                                this.updateTaskList();
                                this.updateStats();
                            }
                            this.showErrorMessage(`API连接失败，无法获取任务状态，确认下服务器地址：${this.apiServer}`);
                            // 更新API连接状态
                            this.apiConnected = false;
                            this.updateApiStatus(false, error.message);
                            return;
                        }
                        
                        // 继续轮询，但增加延迟
                        attempts++;
                        if (attempts < maxAttempts) {
                            // 失败后延迟更长时间再重试
                            const retryDelay = pollInterval * (1 + consecutiveErrors * 0.5);
                            console.log(`⏳ ${retryDelay}ms后重试...`);
                            setTimeout(poll, retryDelay);
                        } else {
                            // 超时，直接清除任务
                            if (this.tasks[taskId]) {
                                delete this.tasks[taskId];
                                this.updateTaskList();
                                this.updateStats();
                            }
                            this.showErrorMessage('任务超时，请检查服务器状态');
                        }
                    }
                };
                
                // 开始轮询
                setTimeout(poll, pollInterval);
            }

            async refreshTasks() {
                try {
                    // 🎯 静默调用API，不影响连接状态显示
                    const result = await this.apiCall('/tasks');
                    
                    console.log('🔄 从服务器获取任务:', result.tasks.length, '个');
                    
                    // 获取ComfyUI返回的所有任务ID
                    const comfyTaskIds = new Set(result.tasks.map(task => task.task_id));
                    
                    // 🎯 新逻辑：合并本地参数 + ComfyUI执行信息
                    result.tasks.forEach(comfyTask => {
                        const taskId = comfyTask.task_id;
                        const localTask = this.tasks[taskId];
                        
                        if (localTask) {
                            // 本地有参数，合并ComfyUI的执行信息
                            // 🎯 关键：保留进度模拟数据（progress, progress_message, progressInterval）
                            this.tasks[taskId] = {
                                ...localTask,                    // 🎯 保留本地参数和状态（包括进度数据）
                                // 只更新ComfyUI提供的执行信息
                                status: comfyTask.status === 'completed' ? 'completed' : localTask.status,
                                result_urls: comfyTask.result_urls || localTask.result_urls,
                                completed_at: comfyTask.completed_at || localTask.completed_at,
                                images: comfyTask.images || localTask.images
                                // progress 和 progress_message 通过 ...localTask 自动保留
                            };
                            
                            // 如果任务完成，保存更新到localStorage
                            if (comfyTask.status === 'completed') {
                                this.saveTaskToLocalStorage(taskId, this.tasks[taskId]);
                                console.log('✅ 任务完成，更新状态:', taskId);
                            }
                        } else {
                            // 本地没有参数（老任务），直接使用ComfyUI数据
                            // 如果任务失败，不添加到列表中
                            if (comfyTask.status === 'failed' || comfyTask.status === 'error') {
                                console.log('⏭️ 跳过失败的历史任务:', taskId);
                                return;
                            }
                            this.tasks[taskId] = comfyTask;
                            console.log('📥 添加ComfyUI历史任务:', taskId);
                        }
                    });
                    
                    // 🎯 检查长时间处于generating状态的任务（可能API关闭时创建的任务）
                    const now = Date.now();
                    Object.keys(this.tasks).forEach(taskId => {
                        const task = this.tasks[taskId];
                        // 如果任务处于generating状态，但ComfyUI没有返回这个任务，且创建时间超过5分钟
                        if (task.status === 'generating' && !comfyTaskIds.has(taskId)) {
                            const createdTime = new Date(task.created_at).getTime();
                            const elapsedMinutes = (now - createdTime) / (1000 * 60);
                            
                            if (elapsedMinutes > 5) {
                                console.warn(`⚠️ 任务 ${taskId} 长时间处于generating状态，清除任务`);
                                delete this.tasks[taskId];
                            }
                        }
                    });
                    
                    // 🚀 无论如何都要更新UI
                    this.updateTaskList();
                    this.updateStats();
                    this.updateTaskMonitorTitle();
                } catch (error) {
                    console.error('❌ 刷新任务失败:', error);
                    
                    // 🚀 关键修复：即使API失败，也要渲染本地缓存的任务！
                    console.log('📦 API失败，尝试显示本地缓存任务:', Object.keys(this.tasks).length, '个');
                    
                    // 清理僵尸任务
                    const now = Date.now();
                    Object.keys(this.tasks).forEach(taskId => {
                        const task = this.tasks[taskId];
                        if (task.status === 'generating') {
                            const createdTime = new Date(task.created_at).getTime();
                            const elapsedMinutes = (now - createdTime) / (1000 * 60);
                            
                            if (elapsedMinutes > 10) {
                                console.warn(`⚠️ 任务 ${taskId} 长时间处于generating状态且无法刷新，清除任务`);
                                delete this.tasks[taskId];
                            }
                        }
                    });
                    
                    // 🚀 强制更新UI，显示本地任务
                    this.updateTaskList();
                    this.updateStats();
                    this.updateTaskMonitorTitle();
                }
            }

            updateTask(taskData) {
                const taskId = taskData.task_id;
                const existingTask = this.tasks[taskId];
                
                // 如果存在本地任务，保留其 request_data
                if (existingTask && existingTask.request_data) {
                    console.log('🔍 updateTask - 保留本地参数:', taskId, existingTask.request_data);
                    this.tasks[taskId] = {
                        ...taskData,
                        request_data: existingTask.request_data  // 保留本地参数
                    };
                } else {
                    this.tasks[taskId] = taskData;
                }
                
                this.updateTaskList();
                this.updateStats();
                this.updateTaskMonitorTitle();
            }

            updateTaskListLegacy() {
                const taskList = document.getElementById('taskList');
